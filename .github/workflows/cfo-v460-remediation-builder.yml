name: CFO v4.6.0 Remediation Builder

on:
  push:
    branches: [remediation/cfo-zero-defect-v4.6.0]
    paths:
      - '.cfo-v460-remediation/**'
      - '.github/workflows/cfo-v460-remediation-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Assemble and apply strict CFO remediation
        run: |
          set -euo pipefail
          cat .cfo-v460-remediation/payload-*.b64 > /tmp/cfo-v460.b64
          base64 -d /tmp/cfo-v460.b64 | gzip -d > /tmp/apply-cfo-v460-remediation.py
          python -m py_compile /tmp/apply-cfo-v460-remediation.py
          python /tmp/apply-cfo-v460-remediation.py
          git diff --check
          rm -rf .cfo-v460-remediation
          rm -f .github/workflows/cfo-v460-remediation-builder.yml
      - name: Commit generated remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated remediation changes remain'
            exit 0
          fi
          git commit -m 'feat(cfo): apply v4.6.0 zero-defect remediation'
          git push origin HEAD:remediation/cfo-zero-defect-v4.6.0
