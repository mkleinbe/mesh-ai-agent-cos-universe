version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-quality:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "bandit"
          - "jsonschema"
          - "types-jsonschema"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
