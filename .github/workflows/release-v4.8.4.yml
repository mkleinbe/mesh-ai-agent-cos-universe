name: v4.8.4 Historical Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/evaluations/test_release_record_correction_v484.py tests/evaluations/test_historical_release_workflows_v483.py
