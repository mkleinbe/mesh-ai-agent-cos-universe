name: mesh-cos-mcp
services:
  mesh-cos-mcp:
    image: ${MESH_COS_IMAGE:?prepared local Mesh image required}
    pull_policy: never
    container_name: mesh-cos-mcp
    restart: unless-stopped
    user: "${MESH_UID:-65532}:${MESH_GID:-65532}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: ${MESH_CPU_LIMIT:-2.0}
    mem_limit: ${MESH_MEMORY_LIMIT:-24g}
    environment:
      MESH_COS_AGENT_ID: cos
      MESH_COS_DEPLOYMENT_RELEASE: ${MESH_COS_DEPLOYMENT_RELEASE:?deployment release required}
      MESH_COS_LEDGER_PATH: /var/lib/mesh/ledger/taskledger.sqlite3
      MESH_COS_REQUIRE_EXISTING_LEDGER: "true"
      MESH_COS_KILL_SWITCH: "false"
      MESH_COS_BRIDGE_TIMEOUT_MS: ${MESH_COS_BRIDGE_TIMEOUT_MS:-30000}
      MESH_COS_MAX_BRIDGE_QUEUE: ${MESH_COS_MAX_BRIDGE_QUEUE:-32}
      MESH_MIN_FREE_BYTES: ${MESH_MIN_FREE_BYTES:-21474836480}
      MESH_COS_SLACK_HITL_REQUIRED: "true"
      MESH_COS_SLACK_AGENT_OPS_CHANNEL_ID: ${MESH_COS_SLACK_AGENT_OPS_CHANNEL_ID:-C0BRL4GCL3A}
      MESH_COS_SLACK_APPROVER_USER_ID_FILE: /run/secrets/slack_approver_user_id
      MESH_COS_SLACK_APPROVER_PRINCIPAL: ${MESH_COS_SLACK_APPROVER_PRINCIPAL:-michael}
      MESH_COS_SLACK_ALLOWED_NOTICE_AUTHOR_IDS: ${MESH_COS_SLACK_ALLOWED_NOTICE_AUTHOR_IDS:-U0BKV7Z8M96,U0BN8V2BU9Z}
      MESH_COS_SLACK_VERIFIER_TOKEN_FILE: /run/secrets/slack_verifier_token
      MESH_COS_SLACK_SOCKET_APP_TOKEN_FILE: /run/secrets/slack_socket_app_token
      MESH_COS_SLACK_APPROVAL_COMMAND: /mesh-approval
      MCP_BIND_HOST: 0.0.0.0
      MCP_PORT: 8080
      MCP_AUTH_MODE: tunnel
      MCP_TRUSTED_CLIENT_IP: 172.30.60.3
    volumes:
      - ${QNAP_MESH_ROOT:-/share/Docker/cos-mcp/state}:/var/lib/mesh:rw
      - ${QNAP_SLACK_APPROVER_USER_ID_FILE:-/share/Docker/cos-mcp/secrets/slack-approver-user-id}:/run/secrets/slack_approver_user_id:ro
      - ${QNAP_SLACK_VERIFIER_TOKEN_FILE:-/share/Docker/cos-mcp/secrets/slack-verifier-token}:/run/secrets/slack_verifier_token:ro
      - ${QNAP_SLACK_SOCKET_APP_TOKEN_FILE:-/share/Docker/cos-mcp/secrets/slack-socket-app-token}:/run/secrets/slack_socket_app_token:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      mesh-cos-private:
        ipv4_address: 172.30.60.2
      lan7:
        ipv4_address: 192.168.7.60
    healthcheck:
      test: [CMD,"node","-e","fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${MESH_LOG_MAX_SIZE:-10m}
        max-file: ${MESH_LOG_MAX_FILES:-5}

  tunnel-client:
    image: ${TUNNEL_IMAGE:?prepared immutable tunnel RepoDigest required}
    pull_policy: never
    container_name: mesh-cos-tunnel
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 256m
    command: ["--control-plane.api-key=file:/run/secrets/openai_tunnel_api_key"]
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?tunnel id required}
      MCP_SERVER_URL: http://mesh-cos-mcp:8080/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    volumes:
      - ${QNAP_TUNNEL_API_KEY_FILE:-/share/Docker/cos-mcp/secrets/openai-tunnel-runtime-key}:/run/secrets/openai_tunnel_api_key:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks:
      mesh-cos-private:
        ipv4_address: 172.30.60.3
    depends_on:
      mesh-cos-mcp:
        condition: service_healthy
    healthcheck:
      test: [CMD,"wget","-q","-O","-","http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  mesh-cos-private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.60.0/29
  lan7:
    external: true
    name: lan7
