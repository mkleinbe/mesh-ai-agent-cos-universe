name: v4.4.1 Commercial Operations orchestration historical verification

# Historical publisher retired: gh release create v4.4.1
# Historical automatic trigger retired: branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.4.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/evaluations/test_commercial_operations_orchestrator_v441.py
      - name: Preserve published v4.4.1 boundary
        run: |
          set -euo pipefail
          test -f docs/release-v4.4.1-commercial-operations.md
          echo 'v4.4.1 is a published historical release; this workflow cannot publish or retarget it.'
