name: ci
on:
  pull_request:
  push:
    branches: [main, 'phase1/**', 'remediation/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: ruff check src tests scripts --select E9,F63,F7,F82
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=55
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
