name: v4.1.15 historical QNAP verification

# Historical publisher retired: gh release create v4.1.15
# Historical automatic trigger retired: branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.1.15
      - name: Preserve published v4.1.15 boundary
        run: |
          set -euo pipefail
          test -f docs/release-4.1.15-slack-plugin-hitl.md
          echo 'v4.1.15 is a published historical release; this workflow cannot publish or retarget it.'
