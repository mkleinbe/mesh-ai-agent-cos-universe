name: v4.9.0 Mesh OpEx Bot Shared Capability Integration

on:
  push:
    branches: [main]
    paths:
      - 'agents/registry.json'
      - 'chatgpt/skills/mesh-coo/**'
      - 'chatgpt/workspace-agents/coo.json'
      - 'scripts/check-chatgpt-packages.py'
      - 'scripts/check-runtime-doc-drift.py'
      - 'tests/evaluations/test_chatgpt_workspace_agent_packages.py'
      - 'tests/evaluations/test_enterprise_consulting_skill_consumption_v470.py'
      - 'tests/evaluations/test_functional_method_expansion_v480.py'
      - 'tests/evaluations/test_historical_release_workflows_v483.py'
      - 'tests/evaluations/test_local_chatgpt_mcp_projection.py'
      - 'tests/evaluations/test_opex_shared_capability_v490.py'
      - 'tests/evaluations/test_phase1_role_model_consistency.py'
      - 'tests/evaluations/test_release_record_correction_v484.py'
      - '.github/workflows/release-v4.8.4.yml'
      - '.github/workflows/release-v4.9.0.yml'
      - '.gitignore'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG-v4.9.0.md'
      - 'docs/README.md'
      - 'docs/release-v4.9.0-mesh-opex-bot-integration.md'
      - 'docs/security-review-v4.9.0-mesh-opex-bot-integration.md'
      - 'docs/verification-v4.9.0-mesh-opex-bot-integration.md'
      - 'docs/gap-audit-v4.9.0-mesh-opex-bot-integration.md'
    pull_request:
      paths:
        - 'agents/registry.json'
        - 'chatgpt/skills/mesh-coo/**'
        - 'chatgpt/workspace-agents/coo.json'
        - 'scripts/check-chatgpt-packages.py'
        - 'scripts/check-runtime-doc-drift.py'
        - 'tests/evaluations/test_chatgpt_workspace_agent_packages.py'
        - 'tests/evaluations/test_enterprise_consulting_skill_consumption_v470.py'
        - 'tests/evaluations/test_functional_method_expansion_v480.py'
        - 'tests/evaluations/test_historical_release_workflows_v483.py'
        - 'tests/evaluations/test_local_chatgpt_mcp_projection.py'
        - 'tests/evaluations/test_opex_shared_capability_v490.py'
        - 'tests/evaluations/test_phase1_role_model_consistency.py'
        - 'tests/evaluations/test_release_record_correction_v484.py'
        - '.github/workflows/release-v4.8.4.yml'
        - '.github/workflows/release-v4.9.0.yml'
        - '.gitignore'
        - 'README.md'
        - 'RELEASE.md'
        - 'CHANGELOG-v4.9.0.md'
        - 'docs/README.md'
        - 'docs/release-v4.9.0-mesh-opex-bot-integration.md'
        - 'docs/security-review-v4.9.0-mesh-opex-bot-integration.md'
        - 'docs/verification-v4.9.0-mesh-opex-bot-integration.md'
        - 'docs/gap-audit-v4.9.0-mesh-opex-bot-integration.md'
    workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.9.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - run: pytest -q tests/evaluations/test_opex_shared_capability_v490.py tests/evaluations/test_release_record_correction_v484.py tests/evaluations/test_historical_release_workflows_v483.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish exact-SHA v4.9.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.9.0 >/dev/null 2>&1; then
            existing_target="$(gh release view v4.9.0 --json targetCommitish --jq .targetCommitish)"
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "v4.9.0 already exists at $existing_target, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo 'v4.9.0 already exists at exact main SHA'
          else
            gh release create v4.9.0 --target "$GITHUB_SHA" --title 'Mesh CoS v4.9.0 Mesh OpEx Bot Integration' --notes-file docs/release-v4.9.0-mesh-opex-bot-integration.md
          fi
      - name: Clean merged feature branch
        run: git push origin --delete feature/mesh-opex-bot-integration-v4.9.0 || true
