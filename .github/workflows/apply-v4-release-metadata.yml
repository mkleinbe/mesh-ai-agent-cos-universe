name: apply-v4-release-metadata

on:
  push:
    branches: [remediation/cos-delegation-contract-v4]
    paths:
      - scripts/apply-v4-release-metadata.py
      - .github/workflows/apply-v4-release-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remediation/cos-delegation-contract-v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/apply-v4-release-metadata.py
      - name: Commit synchronized release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/mesh_cos/__init__.py mcp/package.json mcp/package-lock.json mcp/scripts/smoke-test.mjs chatgpt/workspace-agents
          if git diff --cached --quiet; then
            echo "No metadata changes required."
          else
            git commit -m "chore: synchronize v4.0.0 release metadata"
            git push origin HEAD:remediation/cos-delegation-contract-v4
          fi
