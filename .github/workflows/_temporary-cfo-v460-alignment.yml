name: Temporary CFO v4.6.0 Authority Alignment

on:
  push:
    branches: [remediation/cfo-zero-defect-v4.6.0]
    paths:
      - 'scripts/_temporary_cfo_v460_alignment.py'
      - '.github/workflows/_temporary-cfo-v460-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply final authority alignment
        run: |
          set -euo pipefail
          python -m py_compile scripts/_temporary_cfo_v460_alignment.py
          python scripts/_temporary_cfo_v460_alignment.py
          rm scripts/_temporary_cfo_v460_alignment.py
          git diff --check
      - name: Commit aligned non-workflow source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/registry.json chatgpt/workspace-agents/cfo.json tests/evaluations/test_cfo_execution_v460.py scripts/_temporary_cfo_v460_alignment.py
          git commit -m 'fix(cfo): align source scope and approval authority'
          git push origin HEAD:remediation/cfo-zero-defect-v4.6.0
