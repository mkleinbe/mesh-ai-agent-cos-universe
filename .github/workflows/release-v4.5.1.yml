name: v4.5.1 CFO Financial Analysis Release Closeout

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'RELEASE.md'
      - 'SECURITY.md'
      - 'CHANGELOG-v4.5.1.md'
      - 'docs/verification-v4.5.0-cfo-financial-analysis.md'
      - 'docs/material-turn-v4.5.1.md'
      - 'docs/release-authorization-v4.5.1.md'
      - 'docs/release-v4.5.1-release-closeout.md'
      - 'tests/evaluations/test_cfo_release_closeout_v451.py'
      - '.github/workflows/release-v4.5.1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.5.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - run: pytest -q tests/evaluations/test_cfo_financial_analysis_v450.py
      - run: pytest -q tests/evaluations/test_cfo_release_closeout_v451.py
      - name: Confirm closeout and preserved runtime boundaries
        run: |
          set -euo pipefail
          grep -q 'v4.5.1 CFO Financial Analysis Release Closeout' README.md
          grep -q '^# v4.5.1 CFO Financial Analysis Release Closeout' RELEASE.md
          grep -q 'v4.5.1 CFO Financial Analysis Release Closeout' SECURITY.md
          grep -q '\*\*RELEASED\*\*' docs/verification-v4.5.0-cfo-financial-analysis.md
          grep -q 'CFO implementation version: `1.1.0`' docs/verification-v4.5.0-cfo-financial-analysis.md
          grep -q 'Canonical Phase 1 runtime contract: `4.0.0`' docs/verification-v4.5.0-cfo-financial-analysis.md
          grep -q 'Production QNAP runtime: `4.4.0`, unchanged' docs/verification-v4.5.0-cfo-financial-analysis.md

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish v4.5.1 release closeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.5.1 >/dev/null 2>&1; then
            echo 'v4.5.1 already exists; leaving release unchanged'
            exit 0
          fi
          gh release create v4.5.1 \
            --target "$GITHUB_SHA" \
            --title 'Mesh CoS v4.5.1 CFO Financial Analysis Release Closeout' \
            --notes-file docs/release-v4.5.1-release-closeout.md
