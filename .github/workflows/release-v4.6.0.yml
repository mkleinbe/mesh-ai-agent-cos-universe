name: v4.6.0 CFO Zero-Defect Execution Remediation historical verification

# Historical publisher retired: gh release create v4.6.0 --target "$GITHUB_SHA"
# Historical release-job condition retired: github.ref == 'refs/heads/main'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.6.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: pytest -q tests/evaluations/test_cfo_execution_v460.py
      - name: Preserve published v4.6.0 boundary
        run: |
          set -euo pipefail
          test -f docs/release-v4.6.0-cfo-execution.md
          echo 'v4.6.0 is a published historical release; this workflow cannot publish or retarget it.'
