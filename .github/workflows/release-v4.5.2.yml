name: v4.5.2 CFO Financial Analysis Release State Finalization (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/evaluations/test_cfo_release_state_v452.py
      - name: Verify immutable v4.5.2 release record
        run: |
          set -euo pipefail
          grep -q '^# v4.5.2 CFO Financial Analysis Release State Finalization' docs/release-v4.5.2-release-state-finalization.md
          grep -q '^# Changelog v4.5.2' CHANGELOG-v4.5.2.md
