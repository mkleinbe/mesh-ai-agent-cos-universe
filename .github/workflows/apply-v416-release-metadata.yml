name: apply-v416-release-metadata

on:
  push:
    branches: [enhancement/secure-mcp-production-acceptance-v4.1.6]
    paths:
      - scripts/apply-v416-release-metadata.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: enhancement/secure-mcp-production-acceptance-v4.1.6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/apply-v416-release-metadata.py
      - name: Commit release metadata updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile deployment/qnap/.env.example deployment/qnap/DEPLOYMENT-STEPS.md deployment/qnap/upgrade-checklist.md deployment/qnap/install-checklist.md deployment/qnap/CHATGPT-ACCEPTANCE.md deployment/qnap/README-QNAP.md docs/qnap-production-preflight.md deployment/qnap/scripts/mesh-cos-mcp-prepare.sh tests/evaluations/test_qnap_deployment_automation.py tests/evaluations/test_shared_devils_advocate_integration.py tests/evaluations/test_shared_message_operations_refactor.py .github/workflows/ci.yml .github/workflows/release-production-readiness.yml
          if git diff --cached --quiet; then
            echo "No release metadata changes required."
          else
            git commit -m "build: advance active QNAP release metadata to v4.1.6"
            git push origin HEAD:enhancement/secure-mcp-production-acceptance-v4.1.6
          fi
