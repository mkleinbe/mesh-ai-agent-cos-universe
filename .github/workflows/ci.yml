name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'phase1/**', 'remediation/**', 'chatgpt/**', 'quality/**', 'enhancement/**', 'release/**', 'fix/**', 'refactor/**', 'hotfix/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - name: QNAP POSIX shell regression suite
        run: |
          set -euo pipefail
          sh -n deployment/qnap/qnap-environment-probe.sh
          for f in deployment/qnap/scripts/*.sh deployment/qnap/tests/*.sh; do sh -n "$f"; done
          sh deployment/qnap/tests/test-compose-discovery.sh
          sh deployment/qnap/tests/test-observability.sh
          sh deployment/qnap/tests/test-runtime-permissions.sh
          sh deployment/qnap/tests/test-image-provenance.sh
          sh deployment/qnap/tests/test-slack-hitl-configure.sh
          sh deployment/qnap/tests/test-transactional-promotion.sh
          sh deployment/qnap/tests/test-versioned-release-layout.sh
          sh deployment/qnap/tests/test-restarting-container-backup.sh
          bash -n scripts/build-qnap-release-bundle.sh
          bash -n scripts/finalize-qnap-release-v4.4.0.sh
          bash -n scripts/build-chatgpt-skill-bundle-v4.4.0.sh
          ! grep -q '^  pull_request:' .github/workflows/release-v4.3.0.yml
          ! grep -q 'MESH_COS_SLACK_VERIFIER_TOKEN_FILE' deployment/qnap/compose.yaml
          ! grep -q 'slack-verifier-token' deployment/qnap/scripts/mesh-cos-slack-hitl-configure.sh
          ! grep -q 'slack-verifier-token' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          grep -q 'MESH_COS_SLACK_HITL_MODE: CHATGPT_NATIVE_EVENT_TRIGGER' deployment/qnap/compose.yaml
          grep -q 'MESH_COS_SLACK_BOT_TOKEN_FILE' deployment/qnap/compose.yaml
          ! grep -q 'MESH_COS_SLACK_SOCKET_APP_TOKEN_FILE:' deployment/qnap/compose.yaml
          ! grep -q 'slack_socket_app_token' deployment/qnap/compose.yaml
          ! grep -q 'Slack Socket Mode app-level token' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          ! grep -q '/mesh-approval Socket Mode ingress' deployment/qnap/scripts/mesh-cos-mcp-deploy.sh
          grep -q 'verify the ChatGPT-native Mesh Slack HITL Dispatcher is enabled' deployment/qnap/scripts/mesh-cos-mcp-deploy.sh
          grep -q 'socket_required=false' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          grep -q 'xoxb-' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          grep -q 'MESH_COS_SLACK_APP_ID=A0B49RNE4K0' deployment/qnap/.env.example
          grep -q 'MESH_COS_SLACK_APP_ID=A0B49RNE4K0' deployment/qnap/scripts/mesh-cos-mcp-prepare.sh
          grep -q 'const maxAttempts=6' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'const retryDelayMs=5000' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'slack_provider_read_retry:network_error:attempt=' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'slack_provider_read_failed:invalid_response' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'conversations.history' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'internal: true' deployment/qnap/compose.yaml
          grep -q 'mesh-cos-egress:' deployment/qnap/compose.yaml
          grep -q -- '--network none' deployment/qnap/scripts/mesh-cos-mcp-backup.sh
      - name: Build current-source v4.4.0 candidate artifacts
        env:
          GITHUB_SHA: ${{ github.sha }}
          CANDIDATE_VERSION: '4.4.0'
        run: |
          set -euo pipefail
          bash scripts/build-qnap-release-bundle.sh "$CANDIDATE_VERSION"
          bash scripts/finalize-qnap-release-v4.4.0.sh
          bash scripts/build-chatgpt-skill-bundle-v4.4.0.sh
          ZIP="dist/mesh-cos-mcp-qnap-v${CANDIDATE_VERSION}.zip"
          SKILL_ZIP="dist/mesh-cos-chatgpt-skills-v${CANDIDATE_VERSION}.zip"
          BUNDLE="dist/qnap-bundle/v${CANDIDATE_VERSION}"
          test -f "$ZIP" && test -f "$ZIP.sha256"
          test -f "$SKILL_ZIP" && test -f "$SKILL_ZIP.sha256"
          grep -q "^version=${CANDIDATE_VERSION}$" "$BUNDLE/cos-mcp/release-metadata.txt"
          grep -q "^commit=$GITHUB_SHA$" "$BUNDLE/cos-mcp/release-metadata.txt"
          test -f "$BUNDLE/cos-mcp/CHANGELOG-v4.4.0.md"
          test -f "$BUNDLE/cos-mcp/architecture-v4.4.0-authority-execution.md"
          test -f "$BUNDLE/cos-mcp/security-review-v4.4.0-authority-closure.md"
          test -f "$BUNDLE/cos-mcp/runbook-v4.4.0-authority-execution.md"
          test -f "$BUNDLE/cos-mcp/chatgpt-published-app-production-acceptance-v4.4.0.md"
          grep -q "^source_commit=$GITHUB_SHA$" dist/chatgpt-skill-bundle/v4.4.0/MANIFEST.txt
          grep -q '^skill_count=8$' dist/chatgpt-skill-bundle/v4.4.0/MANIFEST.txt
          grep -q '^agent_execution_model=logical_skill_agent$' dist/chatgpt-skill-bundle/v4.4.0/MANIFEST.txt
          grep -q '^synchronous_workspace_agent_execution=false$' dist/chatgpt-skill-bundle/v4.4.0/MANIFEST.txt
          (cd dist && sha256sum -c "mesh-cos-mcp-qnap-v${CANDIDATE_VERSION}.zip.sha256")
          (cd dist && sha256sum -c "mesh-cos-chatgpt-skills-v${CANDIDATE_VERSION}.zip.sha256")
      - name: Build production-equivalent container from current candidate
        env:
          CANDIDATE_VERSION: '4.4.0'
        run: |
          set -euo pipefail
          BUNDLE="dist/qnap-bundle/v${CANDIDATE_VERSION}"
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-arg IMAGE_VERSION="${CANDIDATE_VERSION}-qnap" -t "mesh-cos-mcp:ci-v${CANDIDATE_VERSION}" "$BUNDLE/cos-mcp/build-context"
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "mesh-cos-mcp:ci-v${CANDIDATE_VERSION}")" = "${CANDIDATE_VERSION}-qnap"
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "mesh-cos-mcp:ci-v${CANDIDATE_VERSION}")" = "$GITHUB_SHA"
      - name: Verify modern MCP discovery and sequential requests
        env:
          MESH_COS_DEPLOYMENT_RELEASE: '4.4.0'
        run: sh deployment/qnap/tests/test-modern-mcp-transport.sh mesh-cos-mcp:ci-v4.4.0
      - name: Write current candidate verification receipt
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            printf 'candidate_version=4.4.0\n'
            printf 'candidate_sha=%s\n' "$GITHUB_SHA"
            printf 'ci_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'runtime_contract=4.0.0\n'
            printf 'security_review=FULL_REVIEW\n'
            python scripts/check-owner-execution-readiness.py
            python scripts/check-capability-closure.py
            python scripts/check-published-action-surface.py
            printf 'workspace_publication_status=BLOCKED_PENDING_ACTUAL_ACTION_SCHEMA_SNAPSHOT\n'
            printf 'qnap_production_status=HUMAN_DEPLOYMENT_REQUIRED\n'
            printf 'release_authority=HUMAN_CONTROLLED_WHEN_MANUAL\n'
          } > dist/verification-receipt-current.txt
          grep -q "^candidate_sha=$GITHUB_SHA$" dist/verification-receipt-current.txt
          grep -q '^OWNER_EXECUTION_READINESS=PASS checked=9$' dist/verification-receipt-current.txt
          grep -q '^CAPABILITY_CLOSURE=PASS agents=10' dist/verification-receipt-current.txt
          grep -q '^PUBLISHED_ACTION_SURFACE=SOURCE_CONTRACT_ONLY' dist/verification-receipt-current.txt
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-cos-mcp-v4.4.0-candidate
          path: |
            dist/mesh-cos-mcp-qnap-v4.4.0.zip
            dist/mesh-cos-mcp-qnap-v4.4.0.zip.sha256
            dist/mesh-cos-chatgpt-skills-v4.4.0.zip
            dist/mesh-cos-chatgpt-skills-v4.4.0.zip.sha256
            dist/verification-receipt-current.txt
          if-no-files-found: error
          retention-days: 30
