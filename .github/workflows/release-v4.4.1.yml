name: v4.4.1 Commercial Operations orchestration release

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG-v4.4.1.md'
      - 'docs/commercial-operations-orchestrator-v4.4.1.md'
      - 'docs/architecture-v4.4.1-commercial-operations.md'
      - 'docs/runbook-v4.4.1-commercial-operations.md'
      - 'docs/security-review-v4.4.1-commercial-operations.md'
      - 'docs/release-v4.4.1-commercial-operations.md'
      - 'specs/commercial-operations-orchestrator-v4.4.1.feature'
      - 'tests/evaluations/test_commercial_operations_orchestrator_v441.py'
      - '.github/workflows/release-v4.4.1.yml'
      - 'README.md'
      - 'RELEASE.md'
      - 'SECURITY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.4.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - run: pytest -q tests/evaluations/test_commercial_operations_orchestrator_v441.py
      - name: Confirm orchestration-only release boundary
        run: |
          set -euo pipefail
          grep -q 'No QNAP deployment is part of this release' docs/release-v4.4.1-commercial-operations.md
          grep -q 'No QNAP action is required' docs/commercial-operations-orchestrator-v4.4.1.md
          grep -q 'QNAP Mesh CoS MCP production runtime remains 4.4.0' docs/release-v4.4.1-commercial-operations.md

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish immutable v4.4.1 repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.4.1 >/dev/null 2>&1; then
            echo 'v4.4.1 already exists; leaving immutable release unchanged'
            exit 0
          fi
          gh release create v4.4.1 \
            --target "$GITHUB_SHA" \
            --title 'Mesh CoS v4.4.1 Commercial Operations Orchestration' \
            --notes-file docs/release-v4.4.1-commercial-operations.md
