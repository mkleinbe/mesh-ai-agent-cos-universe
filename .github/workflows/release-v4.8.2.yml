name: v4.8.2 Functional Method Audit Remediation historical verification

# Historical publisher retired: gh release create v4.8.2 --target "$GITHUB_SHA"
# Historical automatic trigger retired: branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.8.2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: pytest -q tests/evaluations/test_functional_method_remediation_v482.py
      - run: pytest -q tests/evaluations/test_functional_method_expansion_v480.py
      - run: pytest -q tests/evaluations/test_release_state_v481.py
      - name: Preserve published v4.8.2 boundary
        run: |
          set -euo pipefail
          grep -q 'Verification status: \*\*PASS\*\*' docs/verification-v4.8.2-functional-method-audit-remediation.md
          echo 'v4.8.2 is a published historical release; this workflow cannot publish or retarget it.'
