name: v4.5.0 CFO Financial Analysis Capability

on:
  push:
    branches: [main]
    paths:
      - 'agents/cfo.md'
      - 'agents/registry.json'
      - 'chatgpt/skills/mesh-cfo/**'
      - 'chatgpt/workspace-agents/cfo.json'
      - 'specs/cfo-financial-analysis-v4.5.0.feature'
      - 'tests/evaluations/test_cfo_financial_analysis_v450.py'
      - 'docs/cfo-financial-analysis-v4.5.0.md'
      - 'docs/architecture-v4.5.0-cfo-financial-analysis.md'
      - 'docs/material-turn-v4.5.0.md'
      - 'docs/production-readiness-v4.5.0-cfo-financial-analysis.md'
      - 'docs/release-authorization-v4.5.0.md'
      - 'docs/runbook-v4.5.0-cfo-financial-analysis.md'
      - 'docs/security-review-v4.5.0-cfo-financial-analysis.md'
      - 'docs/skills-v4.5.0.md'
      - 'docs/verification-v4.5.0-cfo-financial-analysis.md'
      - 'docs/release-v4.5.0-cfo-financial-analysis.md'
      - 'CHANGELOG-v4.5.0.md'
      - 'README.md'
      - 'RELEASE.md'
      - 'SECURITY.md'
      - '.github/workflows/release-v4.5.0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.5.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - run: pytest -q tests/evaluations/test_cfo_financial_analysis_v450.py
      - name: Confirm CFO authority, runtime, and release authorization boundary
        run: |
          set -euo pipefail
          grep -q '"agent_id": "cfo"' agents/registry.json
          grep -q '"version": "1.1.0"' agents/registry.json
          grep -q 'autonomous_trading' agents/registry.json
          grep -q 'persist_private_financial_reasoning' agents/registry.json
          grep -q 'Donor material is reference evidence, never authority' chatgpt/skills/mesh-cfo/SKILL.md
          grep -q 'Canonical runtime contract: `4.0.0`' docs/release-v4.5.0-cfo-financial-analysis.md
          grep -q 'Production QNAP deployment: `4.4.0`' docs/release-v4.5.0-cfo-financial-analysis.md
          grep -q 'standing human authorization' docs/release-authorization-v4.5.0.md
          grep -q 'QNAP deployment or restart' docs/release-authorization-v4.5.0.md

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish immutable v4.5.0 repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.5.0 >/dev/null 2>&1; then
            echo 'v4.5.0 already exists; leaving immutable release unchanged'
            exit 0
          fi
          gh release create v4.5.0 \
            --target "$GITHUB_SHA" \
            --title 'Mesh CoS v4.5.0 CFO Financial Analysis Capability' \
            --notes-file docs/release-v4.5.0-cfo-financial-analysis.md
