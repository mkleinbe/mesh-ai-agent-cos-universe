name: v4.3.0 cross-agent owner execution release candidate historical verification

# Historical publisher retired: gh release create v4.3.0
# Historical automatic trigger retired: branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.3.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-owner-execution-readiness.py
      - name: Preserve published v4.3.0 boundary
        run: |
          set -euo pipefail
          test -f CHANGELOG-v4.3.0.md
          echo 'v4.3.0 is a published historical release; this workflow cannot publish or retarget it.'
