name: Verify and materialize CFO IRR correction
on:
  push:
    branches: [codex/ai-returns-v1-1]
    paths: [.github/workflows/ai-returns-irr-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply bounded correction and verify behavior
        shell: python
        run: |
          import importlib.util, math, subprocess
          from pathlib import Path
          expected = '1033fcd4a59f28ce46f91d5e21c299737bfb731c'
          assert subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip() == expected
          p = Path('chatgpt/skills/mesh-cfo/scripts/financial_math.py')
          s = p.read_text()
          a = s.index('    low = -0.999999999',s.index('def irr'))
          b = s.index('\n\ndef payback_period',a)
          replacement = '''    tolerance = _number(tolerance, "tolerance")
              if not 0 < tolerance <= 1:
                  raise FinanceInputError("tolerance must be greater than zero and no greater than one")
              if isinstance(max_iterations, bool) or not isinstance(max_iterations, int) or not 1 <= max_iterations <= 10000:
                  raise FinanceInputError("max_iterations must be an integer from 1 through 10000")

              # Log scaling preserves the NPV sign without overflowing at rates near -1.
              terms = [(period, math.copysign(1, value), math.log(abs(value)))
                       for period, value in enumerate(flows) if value != 0]

              def signed_value(rate: float) -> float:
                  log_rate = math.log1p(rate)
                  exponents = [magnitude - period * log_rate for period, _, magnitude in terms]
                  offset = max(exponents)
                  return math.fsum(sign * math.exp(exponent - offset)
                                   for (_, sign, _), exponent in zip(terms, exponents, strict=True))

              low, high = -0.999999999, 1.0
              low_value, high_value = signed_value(low), signed_value(high)
              while low_value * high_value > 0 and high < 1_000_000:
                  high = high * 2 + 1
                  high_value = signed_value(high)
              if low_value == 0:
                  return low
              if high_value == 0:
                  return high
              if low_value * high_value > 0:
                  raise FinanceInputError("cash flows do not yield a bracketed IRR")
              for _ in range(max_iterations):
                  midpoint = (low + high) / 2
                  midpoint_value = signed_value(midpoint)
                  if midpoint_value == 0 or abs(high - low) <= tolerance * max(1, abs(midpoint)):
                      return midpoint
                  if low_value * midpoint_value <= 0:
                      high = midpoint
                  else:
                      low, low_value = midpoint, midpoint_value
              raise FinanceInputError("IRR did not converge within the iteration limit")
          '''
          # Strip YAML nesting from the literal, retaining Python function indentation.
          lines = replacement.splitlines()
          replacement = lines[0] + '\n' + '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[1:]) + '\n'
          p.write_text(s[:a] + replacement + s[b:])
          test = Path('tests/ai_returns/test_finance_regression.py')
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''import importlib.util
          import math
          from pathlib import Path
          import unittest
          PATH = Path(__file__).resolve().parents[2] / 'chatgpt/skills/mesh-cfo/scripts/financial_math.py'
          SPEC = importlib.util.spec_from_file_location('finance', PATH)
          finance = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(finance)
          class FinanceRegression(unittest.TestCase):
              def test_monthly_horizon(self):
                  flows = [-10000] + [150] * 120
                  self.assertAlmostEqual(finance.npv(finance.irr(flows), flows), 0, places=4)
              def test_nonconvergence(self):
                  with self.assertRaises(finance.FinanceInputError): finance.irr([-100,110],max_iterations=1)
              def test_controls(self):
                  for options in ({'tolerance':0},{'tolerance':True},{'max_iterations':True},{'max_iterations':0}):
                      with self.assertRaises(finance.FinanceInputError): finance.irr([-100,110],**options)
              def test_ambiguity(self):
                  with self.assertRaises(finance.FinanceInputError): finance.irr([-100,230,-132])
              def test_negative(self): self.assertAlmostEqual(finance.irr([-100,90]),-.1,places=8)
              def test_extreme(self):
                  expected=math.exp((math.log(1e-308)-math.log(1e308))/100)-1
                  self.assertAlmostEqual(finance.irr([-1e308]+[0]*99+[1e-308]),expected,places=9)
          ''')
          subprocess.run(['python','-m','unittest','discover','-s','tests/ai_returns','-v'],check=True)
          for name in ('.github/workflows/ai-returns-irr-fix.yml','.github/workflows/ai-returns-source-snapshot.yml'):
              Path(name).unlink(missing_ok=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=Mesh Engineering','-c','user.email=engineering@meshdigital.io','commit','-m','fix: stabilize CFO IRR and reject unverified convergence'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/ai-returns-v1-1'],check=True)
