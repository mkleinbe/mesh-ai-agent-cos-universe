name: v4.11.1 Commercial Growth OS Skill Package Closeout

on:
  push:
    branches: [main]
    paths:
      - 'chatgpt/skills/mesh-chief-of-staff/**'
      - 'chatgpt/skills/mesh-cro/**'
      - 'chatgpt/skills/mesh-coo/**'
      - 'chatgpt/skills/mesh-cfo/**'
      - 'scripts/build-chatgpt-skill-bundle-v4.11.1.sh'
      - 'tests/evaluations/test_skill_package_closeout_v4111.py'
      - '.github/workflows/release-v4.11.0.yml'
      - '.github/workflows/release-v4.11.1.yml'
      - 'docs/skills-v4.11.1.md'
      - 'docs/release-v4.11.1-skill-package-closeout.md'
      - 'docs/verification-v4.11.1-skill-package-closeout.md'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG-v4.11.1.md'
  pull_request:
    paths:
      - 'chatgpt/skills/mesh-chief-of-staff/**'
      - 'chatgpt/skills/mesh-cro/**'
      - 'chatgpt/skills/mesh-coo/**'
      - 'chatgpt/skills/mesh-cfo/**'
      - 'scripts/build-chatgpt-skill-bundle-v4.11.1.sh'
      - 'tests/evaluations/test_skill_package_closeout_v4111.py'
      - '.github/workflows/release-v4.11.0.yml'
      - '.github/workflows/release-v4.11.1.yml'
      - 'docs/skills-v4.11.1.md'
      - 'docs/release-v4.11.1-skill-package-closeout.md'
      - 'docs/verification-v4.11.1-skill-package-closeout.md'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG-v4.11.1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - run: pytest -q tests/evaluations/test_commercial_growth_os_v4110.py tests/evaluations/test_skill_package_closeout_v4111.py
      - run: bash scripts/build-chatgpt-skill-bundle-v4.11.1.sh
      - run: unzip -t dist/mesh-cos-chatgpt-skills-v4.11.1.zip
      - run: sha256sum -c mesh-cos-chatgpt-skills-v4.11.1.zip.sha256
        working-directory: dist
      - name: Reproducibility check
        run: |
          first="$(sha256sum dist/mesh-cos-chatgpt-skills-v4.11.1.zip | cut -d' ' -f1)"
          bash scripts/build-chatgpt-skill-bundle-v4.11.1.sh
          second="$(sha256sum dist/mesh-cos-chatgpt-skills-v4.11.1.zip | cut -d' ' -f1)"
          test "$first" = "$second"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/build-chatgpt-skill-bundle-v4.11.1.sh
      - name: Publish exact-SHA v4.11.1 release and Skill bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.11.1 >/dev/null 2>&1; then
            existing_target="$(gh release view v4.11.1 --json targetCommitish --jq .targetCommitish)"
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "v4.11.1 already exists at $existing_target, expected $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh release create v4.11.1 --target "$GITHUB_SHA" --title 'Mesh CoS v4.11.1 Commercial Growth OS Skill Package Closeout' --notes-file docs/release-v4.11.1-skill-package-closeout.md
          fi
          gh release upload v4.11.1 dist/mesh-cos-chatgpt-skills-v4.11.1.zip dist/mesh-cos-chatgpt-skills-v4.11.1.zip.sha256 --clobber
