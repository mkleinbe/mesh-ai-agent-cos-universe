name: v4.1.14 historical QNAP verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.1.14-historical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - name: QNAP POSIX shell regression suite
        run: |
          set -euo pipefail
          sh -n deployment/qnap/qnap-environment-probe.sh
          for f in deployment/qnap/scripts/*.sh deployment/qnap/tests/*.sh; do sh -n "$f"; done
          sh deployment/qnap/tests/test-compose-discovery.sh
          sh deployment/qnap/tests/test-observability.sh
          sh deployment/qnap/tests/test-runtime-permissions.sh
          sh deployment/qnap/tests/test-image-provenance.sh
          sh deployment/qnap/tests/test-slack-hitl-configure.sh
          sh deployment/qnap/tests/test-versioned-release-layout.sh
          ! grep -q 'read_secret_tty' deployment/qnap/scripts/mesh-cos-slack-hitl-configure.sh
          ! grep -q 'command -v stty' deployment/qnap/scripts/mesh-cos-slack-hitl-configure.sh
          ! grep -q 'read_secret_tty' deployment/qnap/scripts/mesh-cos-mcp-prepare.sh
          ! grep -q 'command -v stty' deployment/qnap/scripts/mesh-cos-mcp-prepare.sh
      - name: Rebuild v4.1.14 artifact shape for historical comparison only
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/build-qnap-release-bundle.sh 4.1.14
          test -f dist/mesh-cos-mcp-qnap-v4.1.14.zip
          test -f dist/mesh-cos-mcp-qnap-v4.1.14.zip.sha256
          (cd dist && sha256sum -c mesh-cos-mcp-qnap-v4.1.14.zip.sha256)

# v4.1.14 is already an immutable published release. This workflow is intentionally
# manual-only so newer release branches are not judged against superseded v4.1.14
# implementation assertions and cannot republish or retag the historical release.
