name: v4.5.0 CFO Financial Analysis Capability (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/evaluations/test_cfo_financial_analysis_v450.py
      - name: Verify immutable v4.5.0 release record
        run: |
          set -euo pipefail
          grep -q '^# Release v4.5.0: CFO Financial Analysis Capability' docs/release-v4.5.0-cfo-financial-analysis.md
          grep -q '\*\*RELEASED\*\*' docs/verification-v4.5.0-cfo-financial-analysis.md
          grep -q '075eb8de04d6035a16ff2b6a24d2106ef8783b95' docs/verification-v4.5.0-cfo-financial-analysis.md
