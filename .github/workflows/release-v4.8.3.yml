name: v4.8.3 Historical Publisher Retirement historical verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.8.3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: pytest -q tests/evaluations/test_historical_release_workflows_v483.py
      - name: Preserve published v4.8.3 boundary
        run: |
          set -euo pipefail
          test -f docs/release-v4.8.3-historical-publisher-retirement.md
          echo 'v4.8.3 is a published historical release; this workflow cannot publish or retarget it.'
