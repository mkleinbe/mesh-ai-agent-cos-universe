name: AI Returns source reconciliation
on:
  push:
    branches: [codex/ai-returns-v1-1]
    paths: [.github/workflows/ai-returns-source-snapshot.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Export canonical source without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir snapshot
          git rev-parse HEAD > snapshot/main-sha.txt
          git bundle create snapshot/source.bundle refs/heads/main --tags
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > snapshot/releases.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > snapshot/open-pulls.json
          sha256sum snapshot/source.bundle > snapshot/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-returns-source-snapshot
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
