name: v4.13.3 Historical Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify historical v4.13.3 release remains immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v4.13.3 >/dev/null
          git rev-parse v4.13.3^{commit}
          echo "v4.13.3 is historical and read-only; v4.14.0 owns current SemVer publication."
