name: release-production-readiness

on:
  push:
    branches: [main]
    paths:
      - RELEASE.md
      - CHANGELOG.md
      - SECURITY.md
      - deployment/qnap/**
      - docs/qnap-**
      - docs/chatgpt-**
      - docs/release-**
      - docs/verification-**
      - docs/slack-agent-protocol.md
      - specs/qnap-**
      - specs/scheduled-automation-slack-hitl-v4.1.10.feature
      - Dockerfile
      - scripts/build-qnap-release-bundle.sh
      - .github/workflows/release-production-readiness.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'mkleinbe/mesh-ai-agent-cos-universe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build v4.1.11 QNAP deployment bundle
        run: bash scripts/build-qnap-release-bundle.sh 4.1.11
      - uses: actions/upload-artifact@v6
        with:
          name: mesh-cos-mcp-qnap-v4.1.11
          path: |
            dist/mesh-cos-mcp-qnap-v4.1.11.zip
            dist/mesh-cos-mcp-qnap-v4.1.11.zip.sha256
      - name: Create v4.1.11 release and semantic tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v4.1.11
          ASSET: dist/mesh-cos-mcp-qnap-v4.1.11.zip
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: $TAG already exists; semantic releases are immutable" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "v4.1.11 QNAP Versioned Release Staging Remediation" \
            --notes-file RELEASE.md \
            "$ASSET" "$ASSET.sha256"
