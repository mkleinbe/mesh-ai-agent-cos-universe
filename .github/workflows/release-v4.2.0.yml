name: v4.2.0 historical QNAP native Slack HITL release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.2.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - name: QNAP native Slack HITL shell and security gates
        run: |
          set -euo pipefail
          sh -n deployment/qnap/qnap-environment-probe.sh
          for f in deployment/qnap/scripts/*.sh deployment/qnap/tests/*.sh; do sh -n "$f"; done
          sh deployment/qnap/tests/test-compose-discovery.sh
          sh deployment/qnap/tests/test-observability.sh
          sh deployment/qnap/tests/test-runtime-permissions.sh
          sh deployment/qnap/tests/test-image-provenance.sh
          sh deployment/qnap/tests/test-slack-hitl-configure.sh
          sh deployment/qnap/tests/test-transactional-promotion.sh
          sh deployment/qnap/tests/test-versioned-release-layout.sh
          sh deployment/qnap/tests/test-restarting-container-backup.sh
          grep -q 'MESH_COS_SLACK_HITL_MODE: CHATGPT_NATIVE_EVENT_TRIGGER' deployment/qnap/compose.yaml
          grep -q 'MESH_COS_SLACK_BOT_TOKEN_FILE' deployment/qnap/compose.yaml
          ! grep -q 'MESH_COS_SLACK_SOCKET_APP_TOKEN_FILE:' deployment/qnap/compose.yaml
          ! grep -q 'slack_socket_app_token' deployment/qnap/compose.yaml
          ! grep -q 'Slack Socket Mode app-level token' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          grep -q 'socket_required=false' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          grep -q 'internal: true' deployment/qnap/compose.yaml
          grep -q 'mesh-cos-egress:' deployment/qnap/compose.yaml
          grep -q -- '--network none' deployment/qnap/scripts/mesh-cos-mcp-backup.sh
      - name: Build historical v4.2.0 release bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/build-qnap-release-v4.2.0.sh
          ZIP=dist/mesh-cos-mcp-qnap-v4.2.0.zip
          BUNDLE=dist/qnap-bundle/v4.2.0
          test -f "$ZIP" && test -f "$ZIP.sha256"
          grep -q '^version=4.2.0$' "$BUNDLE/cos-mcp/release-metadata.txt"
          test -f "$BUNDLE/cos-mcp/native-slack-event-hitl-v4.2.0.feature"
          test -f "$BUNDLE/cos-mcp/security-review-v4.2.0.md"
          test -f "$BUNDLE/cos-mcp/release-4.2.0-native-slack-event-hitl.md"
          test -f "$BUNDLE/cos-mcp/chatgpt-native-slack-dispatcher-v4.2.0.md"
          test -f "$BUNDLE/cos-mcp/chatgpt-published-app-production-acceptance-v4.2.0.md"
          test -f "$BUNDLE/cos-mcp/slack-app-manifest.v4.2.0.json"
          (cd dist && sha256sum -c mesh-cos-mcp-qnap-v4.2.0.zip.sha256)
      - name: Build historical production container
        run: |
          set -euo pipefail
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-arg IMAGE_VERSION=4.2.0-qnap -t mesh-cos-mcp:ci-v4.2.0 dist/qnap-bundle/v4.2.0/cos-mcp/build-context
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-cos-mcp-qnap-v4.2.0-historical
          path: |
            dist/mesh-cos-mcp-qnap-v4.2.0.zip
            dist/mesh-cos-mcp-qnap-v4.2.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
