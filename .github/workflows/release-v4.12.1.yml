name: v4.12.1 Historical Verification

# Historical publisher retired after v4.12.1 publication.
# v4.13.0 owns current SemVer publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify immutable v4.12.1 release record
        run: |
          test -f CHANGELOG-v4.12.1.md
          test -f docs/release-v4.12.1-cos-delegation-reporting.md
          test -f docs/security-review-v4.12.1-cos-delegation-reporting.md
          test -f docs/verification-v4.12.1-cos-delegation-reporting.md
