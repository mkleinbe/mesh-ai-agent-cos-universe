name: v4.13.0 Historical Verification

# Historical publisher retired after v4.13.0 publication.
# v4.13.1 owns current SemVer publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify immutable v4.13.0 release record
        run: |
          test -f CHANGELOG-v4.13.0.md
          test -f docs/release-v4.13.0-slack-hitl-peer.md
          test -f docs/security-review-v4.13.0-slack-hitl-peer.md
          test -f docs/verification-v4.13.0-slack-hitl-peer.md
