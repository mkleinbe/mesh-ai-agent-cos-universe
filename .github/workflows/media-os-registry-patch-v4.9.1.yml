name: v4.9.1 Media OS Registry Patch

on:
  push:
    branches:
      - feature/media-os-capability-registration-v4.9.1
    paths:
      - 'scripts/apply-media-os-capability-registration.py'
      - '.github/workflows/media-os-registry-patch-v4.9.1.yml'

permissions:
  contents: write

jobs:
  patch-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/media-os-capability-registration-v4.9.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact capability patch
        run: python scripts/apply-media-os-capability-registration.py
      - name: Validate preserved authority and capability closure
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          python scripts/validate-contracts.py
          python scripts/check-capability-closure.py
          python - <<'PY'
          import json
          r=json.load(open('agents/registry.json'))
          a={x['agent_id']:x for x in r['agents']}
          assert a['cmo']['delegation_permissions']==['vp-content']
          assert a['vp-content']['delegation_permissions']==[]
          assert all(x in a['cmo']['skills'] for x in ['mesh-media-production','mesh-media-verification','mesh-media-distribution'])
          assert 'mesh-media-production' in a['vp-content']['skills']
          assert 'mesh-media-verification' not in a['vp-content']['skills']
          assert 'mesh-media-distribution' not in a['vp-content']['skills']
          PY
      - name: Commit generated canonical registry change
        run: |
          set -euo pipefail
          if git diff --quiet -- agents/registry.json; then
            echo 'registry already reconciled'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/registry.json
          git commit -m 'feat: register Media OS capabilities for CMO and VP Content'
          git push origin HEAD:feature/media-os-capability-registration-v4.9.1
