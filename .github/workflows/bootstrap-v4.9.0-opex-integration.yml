name: Bootstrap v4.9.0 Mesh OpEx Bot integration

on:
  push:
    branches: [feature/mesh-opex-bot-integration-v4.9.0]
    paths:
      - '.github/workflows/bootstrap-v4.9.0-opex-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mesh-opex-bot-integration-v4.9.0
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Apply governed integration
        run: |
          python scripts/migrate_v490_opex.py
          python scripts/fix_v490_checker.py
          python scripts/fix_v490_runtime_drift.py
          python scripts/fix_v490_regression_expectations.py
      - name: Verify migrated repository
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          python -m pip check
          npm ci --prefix mcp
          npm run check --prefix mcp
          python scripts/validate-contracts.py
          python scripts/check-runtime-doc-drift.py
          python scripts/check-chatgpt-packages.py
          python scripts/check-owner-execution-readiness.py
          python scripts/check-capability-closure.py
          python scripts/check-published-action-surface.py
          ruff check src
          ruff check tests scripts --select E9,F63,F7,F82
          mypy src --check-untyped-defs
          pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=100
          bandit -q -r src -lll
          python -m compileall -q src
          pytest -q tests/evaluations/test_opex_shared_capability_v490.py tests/evaluations/test_release_record_correction_v484.py tests/evaluations/test_historical_release_workflows_v483.py
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/migrate_v490_opex.py scripts/fix_v490_checker.py scripts/fix_v490_runtime_drift.py scripts/fix_v490_regression_expectations.py
          git config user.name 'Mesh Release Bot'
          git config user.email 'release-bot@meshdigital.io'
          git add -A
          git commit -m 'feat: integrate Mesh OpEx Bot shared capability v4.9.0'
          git push origin HEAD:feature/mesh-opex-bot-integration-v4.9.0
