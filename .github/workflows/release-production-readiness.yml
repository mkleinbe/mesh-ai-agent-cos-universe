name: release-production-readiness

on:
  push:
    branches: [main]
    paths:
      - RELEASE.md
      - deployment/qnap/**
      - Dockerfile
      - scripts/build-qnap-release-bundle.sh

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'mkleinbe/mesh-ai-agent-cos-universe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build v4.1.2 QNAP deployment bundle
        run: bash scripts/build-qnap-release-bundle.sh 4.1.2
      - uses: actions/upload-artifact@v6
        with:
          name: mesh-cos-mcp-qnap-v4.1.2
          path: |
            dist/mesh-cos-mcp-qnap-v4.1.2.zip
            dist/mesh-cos-mcp-qnap-v4.1.2.zip.sha256
      - name: Create or update v4.1.2 release and semantic tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v4.1.2
          ASSET: dist/mesh-cos-mcp-qnap-v4.1.2.zip
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v4.1.2 QNAP Compose Discovery Fix" \
              --notes-file RELEASE.md \
              "$ASSET" "$ASSET.sha256"
          fi
