name: generate-mcp-lock

on:
  push:
    branches: [enhancement/local-chatgpt-mcp]
    paths:
      - mcp/package.json
      - .github/workflows/generate-mcp-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Generate package lock
        working-directory: mcp
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- mcp/package-lock.json && git ls-files --error-unmatch mcp/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/package-lock.json
          git commit -m "build: lock local MCP dependencies"
          git push origin HEAD:enhancement/local-chatgpt-mcp
