name: v4.9.0 Mesh OpEx Bot historical verification

# Historical publisher retired after v4.9.0 publication.
# v4.9.1 owns current SemVer publication.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.9.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/evaluations/test_opex_shared_capability_v490.py
      - name: Preserve published v4.9.0 boundary
        run: |
          set -euo pipefail
          test -f docs/release-v4.9.0-mesh-opex-bot-integration.md
          echo 'v4.9.0 is a published historical release; this workflow cannot publish or retarget it.'
