name: v4.15.0 Historical Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bd2b284535c73985e1a78c0f7df97f44e27b2292
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable v4.15.0 history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bd2b284535c73985e1a78c0f7df97f44e27b2292'
          test "$(git rev-list -n 1 v4.15.0)" = 'bd2b284535c73985e1a78c0f7df97f44e27b2292'
          target="$(gh release view v4.15.0 --json targetCommitish --jq .targetCommitish)"
          test "$target" = 'bd2b284535c73985e1a78c0f7df97f44e27b2292'
          echo 'v4.15.0 CxO Executive Risk Routing remains immutable.'
