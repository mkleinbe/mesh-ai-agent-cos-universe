name: v4.12.0 Historical Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 435843437ae908167e788a8376b5fb8fdb42b8d5
          fetch-depth: 0
      - name: Verify immutable v4.12.0 history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "435843437ae908167e788a8376b5fb8fdb42b8d5"
          test "$(git rev-list -n 1 v4.12.0)" = "435843437ae908167e788a8376b5fb8fdb42b8d5"
          target="$(gh release view v4.12.0 --json targetCommitish --jq .targetCommitish)"
          test "$target" = "435843437ae908167e788a8376b5fb8fdb42b8d5"
          echo "v4.12.0 Commercial Growth Cadence remains immutable"
