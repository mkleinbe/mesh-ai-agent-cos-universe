name: release-production-readiness

on:
  push:
    branches: [main]
    paths:
      - RELEASE.md

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'mkleinbe/mesh-ai-agent-cos-universe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create v3.0.0 Shared Mesh Message Operations release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.0.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no action."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v3.0.0 Shared Mesh Message Operations" \
              --notes-file RELEASE.md
          fi
