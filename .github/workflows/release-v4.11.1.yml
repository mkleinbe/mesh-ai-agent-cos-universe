name: v4.11.1 Historical Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a2860c133c4ca3fc41c2769f2e3bfbe0d2eb2a7f
          fetch-depth: 0
      - name: Verify immutable v4.11.1 history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a2860c133c4ca3fc41c2769f2e3bfbe0d2eb2a7f"
          test "$(git rev-list -n 1 v4.11.1)" = "a2860c133c4ca3fc41c2769f2e3bfbe0d2eb2a7f"
          target="$(gh release view v4.11.1 --json targetCommitish --jq .targetCommitish)"
          test "$target" = "a2860c133c4ca3fc41c2769f2e3bfbe0d2eb2a7f"
