[project]
name = "mesh-ai-agent-cos-universe"
version = "0.2.0"
description = "Phase 1 operating core for Mesh Digital's AI Chief of Staff agent workforce"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "jsonschema>=4.20",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["mesh_cos"]

[tool.coverage.report]
show_missing = true
skip_covered = true
