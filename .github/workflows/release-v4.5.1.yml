name: v4.5.1 CFO Financial Analysis Release Closeout (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/evaluations/test_cfo_release_closeout_v451.py
      - name: Verify immutable v4.5.1 release record
        run: |
          set -euo pipefail
          grep -q '^# v4.5.1 CFO Financial Analysis Release Closeout' docs/release-v4.5.1-release-closeout.md
          grep -q '^# Changelog v4.5.1' CHANGELOG-v4.5.1.md
