name: v4.13.1 Historical Verification

# Historical publisher retired after v4.13.1 publication.
# v4.13.2 owns current SemVer publication and QNAP 4.4.1 packaging.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify immutable v4.13.1 release record
        run: |
          test -f CHANGELOG-v4.13.1.md
          test -f docs/release-v4.13.1-qnap-doc-sync.md
