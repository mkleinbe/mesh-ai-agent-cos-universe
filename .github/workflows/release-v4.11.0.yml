name: v4.11.0 Commercial Growth OS Integration

on:
  push:
    branches: [main]
    paths:
      - 'chatgpt/skills/mesh-chief-of-staff/SKILL.md'
      - 'chatgpt/skills/mesh-cro/SKILL.md'
      - 'chatgpt/skills/mesh-coo/SKILL.md'
      - 'chatgpt/skills/mesh-cfo/SKILL.md'
      - 'tests/evaluations/test_commercial_growth_os_v4110.py'
      - 'specs/commercial-growth-os-v4.11.0.feature'
      - '.github/workflows/release-v4.11.0.yml'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG-v4.11.0.md'
      - 'docs/release-v4.11.0-commercial-growth-os.md'
      - 'docs/security-review-v4.11.0-commercial-growth-os.md'
      - 'docs/verification-v4.11.0-commercial-growth-os.md'
  pull_request:
    paths:
      - 'chatgpt/skills/mesh-chief-of-staff/SKILL.md'
      - 'chatgpt/skills/mesh-cro/SKILL.md'
      - 'chatgpt/skills/mesh-coo/SKILL.md'
      - 'chatgpt/skills/mesh-cfo/SKILL.md'
      - 'tests/evaluations/test_commercial_growth_os_v4110.py'
      - 'specs/commercial-growth-os-v4.11.0.feature'
      - '.github/workflows/release-v4.11.0.yml'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG-v4.11.0.md'
      - 'docs/release-v4.11.0-commercial-growth-os.md'
      - 'docs/security-review-v4.11.0-commercial-growth-os.md'
      - 'docs/verification-v4.11.0-commercial-growth-os.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.11.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - run: pytest -q tests/evaluations/test_commercial_growth_os_v4110.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha == '2e7ff513e5e1da1c9520a2d2abc7510f6a83a4c5'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish exact-SHA v4.11.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.11.0 >/dev/null 2>&1; then
            existing_target="$(gh release view v4.11.0 --json targetCommitish --jq .targetCommitish)"
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "v4.11.0 already exists at $existing_target, expected $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh release create v4.11.0 --target "$GITHUB_SHA" --title 'Mesh CoS v4.11.0 Commercial Growth OS Integration' --notes-file docs/release-v4.11.0-commercial-growth-os.md
          fi
