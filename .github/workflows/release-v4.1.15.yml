name: v4.1.15 QNAP release candidate

# Historical v4.1.15 verification/release recipe only. Current release automation is v4.1.16.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.1.15-historical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - name: Historical v4.1.15 release shape
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/build-qnap-release-bundle.sh 4.1.15
          test -f dist/mesh-cos-mcp-qnap-v4.1.15.zip
          test -f dist/mesh-cos-mcp-qnap-v4.1.15.zip.sha256
          (cd dist && sha256sum -c mesh-cos-mcp-qnap-v4.1.15.zip.sha256)

  historical-release-recipe:
    if: ${{ false }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Historical immutable publisher recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.1.15 \
            dist/mesh-cos-mcp-qnap-v4.1.15.zip \
            dist/mesh-cos-mcp-qnap-v4.1.15.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title 'v4.1.15 QNAP Slack plugin HITL simplification' \
            --notes-file docs/release-4.1.15-slack-plugin-hitl.md
