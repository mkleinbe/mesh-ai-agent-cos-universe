name: v4.10.0 Historical Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0df486dd0cea2b64ff6f2d1310bcc63497025e4d
          fetch-depth: 0
      - name: Verify immutable v4.10.0 history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0df486dd0cea2b64ff6f2d1310bcc63497025e4d"
          test "$(git rev-list -n 1 v4.10.0)" = "0df486dd0cea2b64ff6f2d1310bcc63497025e4d"
          target="$(gh release view v4.10.0 --json targetCommitish --jq .targetCommitish)"
          test "$target" = "0df486dd0cea2b64ff6f2d1310bcc63497025e4d"
          echo "v4.10.0 Outcome-Driven Orchestration remains immutable"
