name: normalize-mcp-lock

on:
  push:
    branches:
      - refactor/shared-devils-advocate

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/shared-devils-advocate
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Normalize lockfile metadata
        working-directory: mcp
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit normalized lockfile
        run: |
          if git diff --quiet -- mcp/package-lock.json; then
            echo 'Lockfile already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp/package-lock.json
          git commit -m 'build: normalize MCP lockfile metadata'
          git push origin HEAD:refactor/shared-devils-advocate
