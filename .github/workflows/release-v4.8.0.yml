name: v4.8.0 Functional Method Expansion historical verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: pytest -q tests/evaluations/test_functional_method_expansion_v480.py
      - name: Preserve published v4.8.0 historical boundary
        run: |
          set -euo pipefail
          grep -q 'Verification status: \*\*PASS\*\*' docs/verification-v4.8.0-functional-method-expansion.md
          grep -q 'Final publication status: \*\*PASS\*\*' docs/verification-v4.8.0-functional-method-expansion.md
          grep -q 'fec9abd4e3cd44f66eeddf3c33f05cc52745c225' docs/verification-v4.8.0-functional-method-expansion.md
          echo 'v4.8.0 is a published historical feature boundary; semantic publication is owned by the existing tag/release.'
