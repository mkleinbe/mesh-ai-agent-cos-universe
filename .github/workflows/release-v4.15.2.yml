name: v4.15.2 Skill Version Governance

on:
  push:
    branches: [main]
    paths:
      - 'chatgpt/skills/**'
      - 'scripts/package-chatgpt-skills.py'
      - 'scripts/check-chatgpt-packages.py'
      - 'docs/skill-version-contract.md'
      - 'docs/release-v4.15.2-skill-version-governance.md'
      - 'CHANGELOG-v4.15.2.md'
      - '.github/workflows/release-v4.15.2.yml'
  pull_request:
    paths:
      - 'chatgpt/skills/**'
      - 'scripts/package-chatgpt-skills.py'
      - 'scripts/check-chatgpt-packages.py'
      - 'docs/skill-version-contract.md'
      - 'docs/release-v4.15.2-skill-version-governance.md'
      - 'CHANGELOG-v4.15.2.md'
      - '.github/workflows/release-v4.15.2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/package-chatgpt-skills.py --output dist/chatgpt-skills
      - run: cd dist/chatgpt-skills && sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: mesh-cos-chatgpt-skills-v4.15.2
          path: dist/chatgpt-skills/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python scripts/package-chatgpt-skills.py --output dist/chatgpt-skills
      - run: cd dist/chatgpt-skills && sha256sum -c SHA256SUMS.txt
      - name: Publish exact-SHA v4.15.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.15.2 >/dev/null 2>&1; then
            existing_target="$(gh release view v4.15.2 --json targetCommitish --jq .targetCommitish)"
            test "$existing_target" = "$GITHUB_SHA"
          else
            gh release create v4.15.2               --target "$GITHUB_SHA"               --title 'Mesh CoS v4.15.2 Skill Version Governance'               --notes-file docs/release-v4.15.2-skill-version-governance.md
          fi
          gh release upload v4.15.2 dist/chatgpt-skills/* --clobber
