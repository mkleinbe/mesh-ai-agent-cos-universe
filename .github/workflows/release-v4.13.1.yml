name: v4.13.1 QNAP Operator Documentation Alignment

on:
  push:
    branches: [main]
    paths:
      - 'deployment/qnap/README-QNAP.md'
      - 'deployment/qnap/DEPLOYMENT-STEPS.md'
      - 'deployment/qnap/install-checklist.md'
      - 'deployment/qnap/upgrade-checklist.md'
      - 'deployment/qnap/CHATGPT-ACCEPTANCE.md'
      - 'deployment/qnap/.env.example'
      - '.github/workflows/release-v4.13.0.yml'
      - '.github/workflows/release-v4.13.1.yml'
      - 'tests/evaluations/test_historical_release_workflows_v483.py'
      - 'tests/evaluations/test_release_record_correction_v484.py'
      - 'tests/evaluations/test_release_closeout_v4121.py'
      - 'tests/evaluations/test_qnap_release_docs_v4131.py'
      - 'docs/release-v4.13.1-qnap-doc-sync.md'
      - 'docs/README.md'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG-v4.13.1.md'
  pull_request:
    paths:
      - 'deployment/qnap/README-QNAP.md'
      - 'deployment/qnap/DEPLOYMENT-STEPS.md'
      - 'deployment/qnap/install-checklist.md'
      - 'deployment/qnap/upgrade-checklist.md'
      - 'deployment/qnap/CHATGPT-ACCEPTANCE.md'
      - 'deployment/qnap/.env.example'
      - '.github/workflows/release-v4.13.0.yml'
      - '.github/workflows/release-v4.13.1.yml'
      - 'tests/evaluations/test_historical_release_workflows_v483.py'
      - 'tests/evaluations/test_release_record_correction_v484.py'
      - 'tests/evaluations/test_release_closeout_v4121.py'
      - 'tests/evaluations/test_qnap_release_docs_v4131.py'
      - 'docs/release-v4.13.1-qnap-doc-sync.md'
      - 'docs/README.md'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG-v4.13.1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - name: Build exact current-source QNAP candidate
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/build-qnap-release-bundle.sh 4.4.0
          bash scripts/finalize-qnap-release-v4.4.0.sh
          (cd dist && sha256sum -c mesh-cos-mcp-qnap-v4.4.0.zip.sha256)
          grep -q "^commit=$GITHUB_SHA$" dist/qnap-bundle/v4.4.0/cos-mcp/release-metadata.txt
          ! grep -R -n 'v4\.3\.0\|4\.3\.0'             dist/qnap-bundle/v4.4.0/cos-mcp/README-QNAP.md             dist/qnap-bundle/v4.4.0/cos-mcp/DEPLOYMENT-STEPS.md             dist/qnap-bundle/v4.4.0/cos-mcp/install-checklist.md             dist/qnap-bundle/v4.4.0/cos-mcp/upgrade-checklist.md             dist/qnap-bundle/v4.4.0/cos-mcp/CHATGPT-ACCEPTANCE.md             dist/qnap-bundle/v4.4.0/cos-mcp/.env.example

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build exact release asset
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/build-qnap-release-bundle.sh 4.4.0
          bash scripts/finalize-qnap-release-v4.4.0.sh
          (cd dist && sha256sum -c mesh-cos-mcp-qnap-v4.4.0.zip.sha256)
          grep -q "^commit=$GITHUB_SHA$" dist/qnap-bundle/v4.4.0/cos-mcp/release-metadata.txt
      - name: Publish exact-SHA v4.13.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.13.1 >/dev/null 2>&1; then
            existing_target="$(gh release view v4.13.1 --json targetCommitish --jq .targetCommitish)"
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "v4.13.1 already exists at $existing_target, expected $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh release create v4.13.1 --target "$GITHUB_SHA" --title 'Mesh CoS v4.13.1 QNAP Operator Documentation Alignment' --notes-file docs/release-v4.13.1-qnap-doc-sync.md
          fi
          gh release upload v4.13.1             dist/mesh-cos-mcp-qnap-v4.4.0.zip             dist/mesh-cos-mcp-qnap-v4.4.0.zip.sha256             --clobber
