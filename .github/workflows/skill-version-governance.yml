name: Skill version governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Skill identity and version progression
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            python3 scripts/validate_skill_versions.py --repository "$GITHUB_REPOSITORY" --base-ref "origin/$BASE_REF"
          else
            python3 scripts/validate_skill_versions.py --repository "$GITHUB_REPOSITORY"
          fi
