name: ci
on:
  pull_request:
  push:
    branches: [main, 'phase1/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/validate-contracts.py
      - run: pytest
      - run: python -m compileall -q src
