name: reconcile-v2-documentation

on:
  push:
    branches:
      - refactor/shared-devils-advocate

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/shared-devils-advocate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add canonical v2 current-state notes
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '<!-- mesh-cos-v2-shared-da -->'
          note = '''\n\n<!-- mesh-cos-v2-shared-da -->\n## v2.0.0 current architecture\n\nThe live Phase 1 runtime is a **10-agent** organization. The former repository-local Devil's Advocate agent and duplicate role Skill are removed. **Mesh Devil's Advocate** is an external **shared Skill** available only to Chief of Staff and CRO through governed Skill invocation. It is **advisory** only, cannot overwrite **canonical facts**, cannot execute external actions, and returns decision authority to the owning role or qualified human. `TaskLedger` remains canonical state; ChatGPT uses `LOCAL_STDIO` through `MCPRuntime` with deny-by-default allowlists, human-only approval/override paths, `check-chatgpt-packages.py` drift enforcement, and the 100% branch-aware coverage gate. Historical references to an 11-agent roster or a local Devil's Advocate role describe superseded releases only.\n'''

          roots = [Path('.'), Path('docs'), Path('chatgpt'), Path('mcp')]
          seen = set()
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.md'):
                  if '.git' in path.parts or path in seen:
                      continue
                  seen.add(path)
                  text = path.read_text()
                  affected = any(token in text for token in ("Devil's Advocate", '11 agents', '11-agent', 'v1.1.0', '1.1.0'))
                  required_current = str(path) in {
                      'AGENTS.md', 'SECURITY.md', 'docs/README.md', 'docs/decision-rights.md',
                      'docs/delegation-model.md', 'docs/conflict-resolution.md', 'docs/production-readiness.md',
                      'docs/security-governance.md', 'docs/testing-evaluation.md', 'docs/runbook.md',
                      'chatgpt/README.md', 'chatgpt/mcp/README.md', 'mcp/README.md',
                      'docs/phase-1-operating-contract.md', 'docs/phase-1-final-closure-2026-08-17.md',
                      'chatgpt/workspace-agent-gap-assessment-2026-08-17.md'
                  }
                  if (affected or required_current) and marker not in text:
                      path.write_text(text.rstrip() + note + '\n')
          PY
      - name: Commit documentation reconciliation
        run: |
          if git diff --quiet -- '*.md' 'docs/**/*.md' 'chatgpt/**/*.md' 'mcp/**/*.md'; then
            echo 'Documentation already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.md' docs chatgpt mcp
          git commit -m 'docs: reconcile repository to v2 shared challenge model'
          git push origin HEAD:refactor/shared-devils-advocate
