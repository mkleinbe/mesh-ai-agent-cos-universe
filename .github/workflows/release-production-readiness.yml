name: release-production-readiness

on:
  push:
    branches: [main]
    paths:
      - RELEASE.md
      - CHANGELOG.md
      - SECURITY.md
      - deployment/qnap/**
      - docs/qnap-**
      - docs/chatgpt-**
      - docs/release-**
      - docs/slack-agent-protocol.md
      - specs/qnap-**
      - specs/scheduled-automation-slack-hitl-v4.1.10.feature
      - Dockerfile
      - scripts/build-qnap-release-bundle.sh
      - .github/workflows/release-production-readiness.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'mkleinbe/mesh-ai-agent-cos-universe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build v4.1.10 QNAP deployment bundle
        run: bash scripts/build-qnap-release-bundle.sh 4.1.10
      - uses: actions/upload-artifact@v6
        with:
          name: mesh-cos-mcp-qnap-v4.1.10
          path: |
            dist/mesh-cos-mcp-qnap-v4.1.10.zip
            dist/mesh-cos-mcp-qnap-v4.1.10.zip.sha256
      - name: Create or update v4.1.10 release and semantic tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v4.1.10
          ASSET: dist/mesh-cos-mcp-qnap-v4.1.10.zip
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v4.1.10 Scheduled Automation and Slack HITL Hardening" \
              --notes-file RELEASE.md \
              "$ASSET" "$ASSET.sha256"
          fi
