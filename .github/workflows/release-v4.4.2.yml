name: v4.4.2 Data Intelligence orchestration historical verification

# Historical publisher retired: gh release create v4.4.2
# Historical automatic trigger retired: branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.4.2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/evaluations/test_data_intelligence_orchestrator_v442.py
      - name: Preserve published v4.4.2 boundary
        run: |
          set -euo pipefail
          test -f docs/release-v4.4.2-data-intelligence.md
          echo 'v4.4.2 is a published historical release; this workflow cannot publish or retarget it.'
