name: v4.7.0 Enterprise Consulting Skill Consumption historical verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: pytest -q tests/evaluations/test_enterprise_consulting_skill_consumption_v470.py
      - name: Preserve v4.7.0 historical boundary
        run: |
          set -euo pipefail
          grep -q '^# v4.7.0 Enterprise Consulting Skill Consumption' CHANGELOG-v4.7.0.md
          test -f docs/release-v4.7.0-enterprise-consulting.md
          echo 'v4.7.0 historical verification complete; semantic publication is owned by the already-published tag/release.'
