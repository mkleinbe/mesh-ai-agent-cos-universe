name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'phase1/**', 'remediation/**', 'chatgpt/**', 'quality/**', 'enhancement/**', 'release/**', 'fix/**', 'refactor/**', 'hotfix/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - name: QNAP POSIX shell regression suite
        run: |
          set -euo pipefail
          sh -n deployment/qnap/qnap-environment-probe.sh
          for f in deployment/qnap/scripts/*.sh deployment/qnap/tests/*.sh; do sh -n "$f"; done
          sh deployment/qnap/tests/test-compose-discovery.sh
          sh deployment/qnap/tests/test-observability.sh
          sh deployment/qnap/tests/test-runtime-permissions.sh
          sh deployment/qnap/tests/test-image-provenance.sh
          sh deployment/qnap/tests/test-slack-hitl-configure.sh
          sh deployment/qnap/tests/test-transactional-promotion.sh
          sh deployment/qnap/tests/test-versioned-release-layout.sh
          sh deployment/qnap/tests/test-restarting-container-backup.sh
          bash -n scripts/build-qnap-release-bundle.sh
          bash -n scripts/build-qnap-release-v4.3.0.sh
          ! grep -q 'MESH_COS_SLACK_VERIFIER_TOKEN_FILE' deployment/qnap/compose.yaml
          ! grep -q 'slack-verifier-token' deployment/qnap/scripts/mesh-cos-slack-hitl-configure.sh
          ! grep -q 'slack-verifier-token' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          grep -q 'MESH_COS_SLACK_HITL_MODE: CHATGPT_NATIVE_EVENT_TRIGGER' deployment/qnap/compose.yaml
          grep -q 'MESH_COS_SLACK_BOT_TOKEN_FILE' deployment/qnap/compose.yaml
          ! grep -q 'MESH_COS_SLACK_SOCKET_APP_TOKEN_FILE:' deployment/qnap/compose.yaml
          ! grep -q 'slack_socket_app_token' deployment/qnap/compose.yaml
          ! grep -q 'Slack Socket Mode app-level token' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          ! grep -q '/mesh-approval Socket Mode ingress' deployment/qnap/scripts/mesh-cos-mcp-deploy.sh
          grep -q 'verify the ChatGPT-native Mesh Slack HITL Dispatcher is enabled' deployment/qnap/scripts/mesh-cos-mcp-deploy.sh
          grep -q 'socket_required=false' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          grep -q 'xoxb-' deployment/qnap/scripts/mesh-cos-slack-hitl-provision.sh
          grep -q 'MESH_COS_SLACK_APP_ID=A0B49RNE4K0' deployment/qnap/.env.example
          grep -q 'MESH_COS_SLACK_APP_ID=A0B49RNE4K0' deployment/qnap/scripts/mesh-cos-mcp-prepare.sh
          grep -q 'const maxAttempts=6' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'const retryDelayMs=5000' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'slack_provider_read_retry:network_error:attempt=' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'slack_provider_read_failed:invalid_response' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'conversations.history' deployment/qnap/scripts/mesh-cos-mcp-verify.sh
          grep -q 'internal: true' deployment/qnap/compose.yaml
          grep -q 'mesh-cos-egress:' deployment/qnap/compose.yaml
          grep -q -- '--network none' deployment/qnap/scripts/mesh-cos-mcp-backup.sh
      - name: Build exact v4.3.0 QNAP release bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/build-qnap-release-v4.3.0.sh
          ZIP=dist/mesh-cos-mcp-qnap-v4.3.0.zip
          BUNDLE=dist/qnap-bundle/v4.3.0
          test -f "$ZIP" && test -f "$ZIP.sha256"
          grep -q '^version=4.3.0$' "$BUNDLE/cos-mcp/release-metadata.txt"
          grep -q "^commit=$GITHUB_SHA$" "$BUNDLE/cos-mcp/release-metadata.txt"
          test -f "$BUNDLE/cos-mcp/CHANGELOG-v4.3.0.md"
          test -f "$BUNDLE/cos-mcp/cross-agent-owner-execution.feature"
          test -f "$BUNDLE/cos-mcp/pf-057-cross-agent-owner-execution.md"
          test -f "$BUNDLE/cos-mcp/security-review-v4.3.0-cross-agent-owner-execution.md"
          test -f "$BUNDLE/cos-mcp/release-4.3.0-cross-agent-owner-execution.md"
          test -f "$BUNDLE/cos-mcp/verification-v4.3.0-cross-agent-owner-execution.md"
          test -f "$BUNDLE/cos-mcp/chatgpt-published-app-production-acceptance-v4.3.0.md"
          test -f "$BUNDLE/cos-mcp/chatgpt-native-slack-dispatcher-v4.2.3.md"
          test -f "$BUNDLE/cos-mcp/slack-app-manifest.v4.2.3.json"
          test ! -f "$BUNDLE/cos-mcp/slack-app-manifest.v4.1.17.json"
          test ! -f "$BUNDLE/cos-mcp/slack-app-manifest.v4.2.0.json"
          test ! -f "$BUNDLE/cos-mcp/slack-app-manifest.v4.2.1.json"
          test ! -f "$BUNDLE/cos-mcp/slack-app-manifest.v4.2.2.json"
          unzip -Z1 "$ZIP" > /tmp/v430.entries
          if grep -Ev '^v4\.3\.0/' /tmp/v430.entries; then exit 1; fi
          grep -qx 'v4.3.0/mesh-cos-mcp-deploy.sh' /tmp/v430.entries
          grep -qx 'v4.3.0/cos-mcp/release-metadata.txt' /tmp/v430.entries
          grep -qx 'v4.3.0/cos-mcp/cross-agent-owner-execution.feature' /tmp/v430.entries
          (cd dist && sha256sum -c mesh-cos-mcp-qnap-v4.3.0.zip.sha256)
      - name: Build production container from exact v4.3.0 bundle
        run: |
          set -euo pipefail
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-arg IMAGE_VERSION=4.3.0-qnap -t mesh-cos-mcp:ci-v4.3.0 dist/qnap-bundle/v4.3.0/cos-mcp/build-context
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' mesh-cos-mcp:ci-v4.3.0)" = '4.3.0-qnap'
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' mesh-cos-mcp:ci-v4.3.0)" = "$GITHUB_SHA"
      - name: Verify modern MCP discovery and sequential requests
        env:
          MESH_COS_DEPLOYMENT_RELEASE: '4.3.0'
        run: sh deployment/qnap/tests/test-modern-mcp-transport.sh mesh-cos-mcp:ci-v4.3.0
      - uses: actions/upload-artifact@v6
        with:
          name: mesh-cos-mcp-qnap-v4.3.0-ci
          path: |
            dist/mesh-cos-mcp-qnap-v4.3.0.zip
            dist/mesh-cos-mcp-qnap-v4.3.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
