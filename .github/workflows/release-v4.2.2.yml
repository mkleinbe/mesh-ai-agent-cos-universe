name: historical v4.2.2 release record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo 'v4.2.2 is an immutable historical release.'
          echo 'Use the published v4.2.2 GitHub release assets for historical verification.'
          test -f docs/release-4.2.2-slack-provider-transport.md
          test -f CHANGELOG-v4.2.2.md
