name: v4.5.2 CFO Financial Analysis Release State Finalization

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'RELEASE.md'
      - 'SECURITY.md'
      - 'CHANGELOG-v4.5.2.md'
      - 'docs/material-turn-v4.5.2.md'
      - 'docs/release-authorization-v4.5.2.md'
      - 'docs/release-v4.5.2-release-state-finalization.md'
      - 'tests/evaluations/test_cfo_release_state_v452.py'
      - '.github/workflows/release-v4.5.2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.5.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - run: pytest -q tests/evaluations/test_cfo_financial_analysis_v450.py
      - run: pytest -q tests/evaluations/test_cfo_release_closeout_v451.py
      - run: pytest -q tests/evaluations/test_cfo_release_state_v452.py
      - name: Confirm durable current release and preserved runtime boundaries
        run: |
          set -euo pipefail
          grep -q 'Current repository release: `v4.5.2 CFO Financial Analysis Release State Finalization`' README.md
          grep -q '^# v4.5.2 CFO Financial Analysis Release State Finalization' RELEASE.md
          grep -q 'Current repository release: \*\*v4.5.2 CFO Financial Analysis Release State Finalization\*\*' SECURITY.md
          ! head -n 20 README.md | grep -qi 'release candidate'
          ! head -n 20 RELEASE.md | grep -qi 'release candidate'
          ! head -n 20 SECURITY.md | grep -qi 'release candidate'
          grep -q 'CFO implementation remains \*\*1.1.0\*\*' RELEASE.md
          grep -q '4.0.0' RELEASE.md
          grep -q '4.4.0' RELEASE.md

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish v4.5.2 release state finalization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.5.2 >/dev/null 2>&1; then
            echo 'v4.5.2 already exists; leaving release unchanged'
            exit 0
          fi
          gh release create v4.5.2 \
            --target "$GITHUB_SHA" \
            --title 'Mesh CoS v4.5.2 CFO Financial Analysis Release State Finalization' \
            --notes-file docs/release-v4.5.2-release-state-finalization.md
