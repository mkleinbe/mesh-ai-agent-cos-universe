name: v4.4.0 delegated denial audit patch
on:
  push:
    branches: ['fix/v4.4.0-authority-closure']
    paths: ['.github/workflows/v440-runtime-audit-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v4.4.0-authority-closure
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact-match runtime patch
        run: python .github/patches/v440_runtime_audit_patch.py
      - name: Remove temporary patch assets
        run: rm .github/patches/v440_runtime_audit_patch.py .github/workflows/v440-runtime-audit-patch.yml
      - name: Commit patched tree
        run: |
          set -euo pipefail
          git config user.name 'Mike K.'
          git config user.email 'mkleinberg@meshdigital.io'
          git add -A
          git diff --cached --check
          git commit -m 'Audit delegated capability denials canonically'
          git push origin HEAD:fix/v4.4.0-authority-closure
