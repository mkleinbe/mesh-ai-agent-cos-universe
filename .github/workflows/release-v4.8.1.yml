name: v4.8.1 Release State Finalization historical verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: pytest -q tests/evaluations/test_release_state_v481.py
      - name: Preserve published v4.8.1 historical boundary
        run: |
          set -euo pipefail
          grep -Eq '^Verification status: \*\*PASS\*\*[[:space:]]*$' docs/verification-v4.8.1-release-state-finalization.md
          grep -q 'ecb04f495910912fb9181adf3553a62a9f408f3c' docs/verification-v4.8.1-release-state-finalization.md
          grep -q 'PR #72 is merged' docs/verification-v4.8.1-release-state-finalization.md
          echo 'v4.8.1 is a published historical boundary; semantic publication is owned by the existing immutable tag and GitHub Release.'
