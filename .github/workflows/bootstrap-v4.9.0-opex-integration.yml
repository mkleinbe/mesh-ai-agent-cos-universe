name: Bootstrap v4.9.0 Mesh OpEx Bot integration

on:
  push:
    branches: [feature/mesh-opex-bot-integration-v4.9.0]
    paths:
      - '.github/workflows/bootstrap-v4.9.0-opex-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mesh-opex-bot-integration-v4.9.0
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Apply governed v4.9.0 integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          capability = {
              'capability': 'mesh-opex-bot',
              'display_name': 'Mesh OpEx Bot',
              'type': 'shared_skill',
              'deployment': 'EXTERNAL_SHARED_SKILL',
              'consumers': ['coo'],
              'authority': 'OPERATIONAL_EXCELLENCE_ADVISORY_ONLY',
              'canonical_facts_modified': False,
              'external_action_included': False,
              'request_contract': 'mesh.opex.request.v1',
              'response_contract': 'mesh.opex.handoff.v1',
              'rule': 'Provide Operational Excellence advisory evidence without replacing COO delivery feasibility, CoS TaskLedger/work-graph authority, CFO financial truth, AgentOps workforce-health authority, or qualified-human regulatory, clinical, legal, security, staffing, and consequential decision authority.'
          }

          registry_path = root / 'agents/registry.json'
          registry = json.loads(registry_path.read_text())
          shared = registry.setdefault('shared_capabilities', [])
          matches = [i for i, item in enumerate(shared) if item.get('capability') == 'mesh-opex-bot']
          if matches:
              shared[matches[0]] = capability
              for i in reversed(matches[1:]):
                  shared.pop(i)
          else:
              shared.append(capability)
          coo = next(item for item in registry['agents'] if item['agent_id'] == 'coo')
          skills = coo.setdefault('skills', [])
          if 'mesh-opex-bot' not in skills:
              skills.append('mesh-opex-bot')
          registry_path.write_text(json.dumps(registry, indent=2) + '\n')

          manifest_path = root / 'chatgpt/workspace-agents/coo.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['shared_skills'] = ['mesh-opex-bot']
          manifest['builder_configuration']['shared_skills'] = ['mesh-opex-bot']
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          role_path = root / 'chatgpt/skills/mesh-coo/references/role-contract.md'
          role = role_path.read_text()
          marker = '## Mesh OpEx Bot shared capability\n'
          if marker not in role:
              role += '''\n## Mesh OpEx Bot shared capability\n\n`mesh-opex-bot` is an external shared Skill available only to the COO in Phase 1. Invoke it for specialist Operational Excellence diagnosis, minimum-sufficient method selection, improvement-system design, quality/reliability analysis, or AI-enabled operations redesign.\n\nRequest contract: `mesh.opex.request.v1`. Response/handoff contract: `mesh.opex.handoff.v1`. The capability is advisory only and cannot modify canonical facts, execute external actions, own TaskLedger state, confirm staffing or capacity, validate financial truth, govern agent workforce health, or issue regulatory, clinical, legal, or security conclusions.\n\nCOO retains delivery feasibility, capacity, staffing/resource readiness, partner capacity, dependencies, and operational constraints. CoS retains TaskLedger and work-graph orchestration. CFO retains financial truth and benefit validation. AgentOps retains agent workforce health and telemetry. Qualified humans retain regulated and consequential authority. If the shared Skill is unavailable, preserve the request as a bounded handoff and do not fabricate an OpEx result.\n'''
          role_path.write_text(role)

          checker_path = root / 'scripts/check-chatgpt-packages.py'
          checker = checker_path.read_text()
          checker = checker.replace('ANALYTICS_CONSUMERS = {"cfo"}\n', 'ANALYTICS_CONSUMERS = {"cfo"}\nOPEX_CONSUMERS = {"coo"}\n')
          checker = checker.replace(
              'require(set(shared) == {"mesh-devils-advocate", "mesh-data-analytics"}, "External Phase 1 shared Skill set drifted")',
              'require(set(shared) == {"mesh-devils-advocate", "mesh-data-analytics", "mesh-opex-bot"}, "External Phase 1 shared Skill set drifted")'
          )
          analytics_anchor = 'require(analytics["external_action_included"] is False, "Shared analytics cannot execute external actions")\n'
          opex_assertions = '''opex = shared["mesh-opex-bot"]\nrequire(opex["deployment"] == "EXTERNAL_SHARED_SKILL", "Mesh OpEx Bot deployment drifted")\nrequire(set(opex["consumers"]) == OPEX_CONSUMERS, "Mesh OpEx Bot consumers drifted")\nrequire(opex["authority"] == "OPERATIONAL_EXCELLENCE_ADVISORY_ONLY", "Mesh OpEx Bot authority drifted")\nrequire(opex["canonical_facts_modified"] is False, "Mesh OpEx Bot cannot modify canonical facts")\nrequire(opex["external_action_included"] is False, "Mesh OpEx Bot cannot execute external actions")\nrequire(opex["request_contract"] == "mesh.opex.request.v1", "Mesh OpEx Bot request contract drifted")\nrequire(opex["response_contract"] == "mesh.opex.handoff.v1", "Mesh OpEx Bot response contract drifted")\n'''
          if 'opex = shared["mesh-opex-bot"]' not in checker:
              checker = checker.replace(analytics_anchor, analytics_anchor + opex_assertions)
          expected_anchor = '''    if agent_id in ANALYTICS_CONSUMERS:\n        expected_shared.append("mesh-data-analytics")\n'''
          if 'if agent_id in OPEX_CONSUMERS:' not in checker:
              checker = checker.replace(expected_anchor, expected_anchor + '''    if agent_id in OPEX_CONSUMERS:\n        expected_shared.append("mesh-opex-bot")\n''')
          entitlement_anchor = '    require(("mesh-data-analytics" in record.get("skills", [])) is (agent_id in ANALYTICS_CONSUMERS), f"{agent_id}: Mesh Data Analytics entitlement drifted")\n'
          if 'Mesh OpEx Bot entitlement drifted' not in checker:
              checker = checker.replace(entitlement_anchor, entitlement_anchor + '    require(("mesh-opex-bot" in record.get("skills", [])) is (agent_id in OPEX_CONSUMERS), f"{agent_id}: Mesh OpEx Bot entitlement drifted")\n')
          checker_path.write_text(checker)

          readme_path = root / 'README.md'
          readme = readme_path.read_text()
          readme = readme.replace('**Current repository release: `v4.8.4 Release Record Correction`.', '**Current repository release: `v4.9.0 Mesh OpEx Bot Shared Capability Integration`.')
          readme_path.write_text(readme)

          docs_index_path = root / 'docs/README.md'
          docs_index = docs_index_path.read_text()
          docs_index = docs_index.replace('Current repository release: **`v4.8.4 Release Record Correction`**.', 'Current repository release: **`v4.9.0 Mesh OpEx Bot Shared Capability Integration`**.')
          docs_index_path.write_text(docs_index)

          release_path = root / 'RELEASE.md'
          release = release_path.read_text()
          heading = '# v4.9.0 Mesh OpEx Bot Shared Capability Integration\n'
          if not release.startswith(heading):
              release = heading + '''\n`v4.9.0 Mesh OpEx Bot Shared Capability Integration` adds the external governed `mesh-opex-bot` capability to the COO without creating an eleventh agent or changing runtime authority.\n\nCanonical Phase 1 authority/runtime contract: `4.0.0`, unchanged.  \nProduction QNAP deployment: `4.4.0`, unchanged.  \nRegistered organization: exactly 10 agents, unchanged.\n\nThe COO is the sole Phase 1 consumer. The shared Skill is advisory only, modifies no canonical facts, executes no external action, and uses `mesh.opex.request.v1` and `mesh.opex.handoff.v1`. COO retains delivery feasibility/capacity/staffing authority, CoS retains TaskLedger and work-graph orchestration, CFO retains financial truth, AgentOps retains agent-workforce health, and qualified humans retain regulated and consequential decisions.\n\nv4.8.4 becomes historical read-only verification. v4.9.0 is the sole active exact-SHA SemVer publisher.\n\nSee `docs/release-v4.9.0-mesh-opex-bot-integration.md`, `docs/security-review-v4.9.0-mesh-opex-bot-integration.md`, `docs/verification-v4.9.0-mesh-opex-bot-integration.md`, `docs/gap-audit-v4.9.0-mesh-opex-bot-integration.md`, and `CHANGELOG-v4.9.0.md`.\n\n''' + release
              release_path.write_text(release)
          PY

          cat > CHANGELOG-v4.9.0.md <<'EOF'
          # Changelog v4.9.0

          ## Added
          - External governed `mesh-opex-bot` shared capability for the COO only.
          - Request/response contract projection for `mesh.opex.request.v1` and `mesh.opex.handoff.v1`.
          - Workspace-agent, role-contract, package-drift, and regression coverage for the shared capability.

          ## Preserved
          - Exactly ten Phase 1 agents.
          - Canonical runtime authority contract 4.0.0 and production QNAP 4.4.0.
          - COO, CoS, CFO, AgentOps, and qualified-human authority boundaries.
          - No canonical-fact mutation or external-action authority for Mesh OpEx Bot.
          EOF

          cat > docs/release-v4.9.0-mesh-opex-bot-integration.md <<'EOF'
          # v4.9.0 Mesh OpEx Bot Shared Capability Integration

          Release date: September 13, 2026

          This repository release integrates `mesh-opex-bot` as an external shared Skill consumed only by the COO. It does not add an agent principal, change TaskLedger ownership, change MCP transport, change production QNAP 4.4.0, or alter the canonical 4.0.0 authority/runtime contract.

          The capability is advisory only. It cannot modify canonical facts or execute external action. COO retains delivery feasibility, capacity, staffing/resource readiness, dependencies, partner capacity, and operating constraints. CoS retains enterprise work-graph and TaskLedger authority. CFO retains financial truth and benefit validation. AgentOps retains agent workforce health and telemetry. Qualified humans retain regulated and consequential decision authority.

          v4.8.4 is retired to manual read-only historical verification. v4.9.0 becomes the sole exact-SHA SemVer publisher after all verification gates pass.
          EOF

          cat > docs/security-review-v4.9.0-mesh-opex-bot-integration.md <<'EOF'
          # v4.9.0 Security Review

          Applicability: **TARGETED**

          Sensitive surface: shared Skill entitlement and AI-native delegation/composition boundary. No new network, OAuth, credential, secret, persistence, or external-write surface is introduced.

          Verified security properties:
          - `mesh-opex-bot` remains a Skill, never an agent principal.
          - Consumer scope is exactly `coo`.
          - `canonical_facts_modified` is false.
          - `external_action_included` is false.
          - COO, CoS, CFO, AgentOps, and qualified-human authority remains explicit.
          - Missing shared Skill availability degrades to a bounded handoff, never fabricated execution.
          - Existing MCP allowlists and human-only operations remain unchanged.

          Codex Security is not claimed unless separately evidenced. Repository tests, package drift checks, and independent verification provide the available bounded evidence for this change.
          EOF

          cat > docs/verification-v4.9.0-mesh-opex-bot-integration.md <<'EOF'
          # v4.9.0 Verification

          Required release proof:
          - exactly 10 registered agents;
          - no OpEx agent principal;
          - one `mesh-opex-bot` external shared capability;
          - COO is the sole consumer and has the matching Skill entitlement;
          - request contract `mesh.opex.request.v1` and response contract `mesh.opex.handoff.v1`;
          - canonical-fact mutation and external action remain false;
          - CoS, CFO, AgentOps, COO, and human authority boundaries remain intact;
          - package-drift and repository regression suites pass;
          - v4.8.4 is historical read-only and v4.9.0 is the sole exact-SHA publisher;
          - after merge, `main == tag v4.9.0 == GitHub Release target`.
          EOF

          cat > docs/gap-audit-v4.9.0-mesh-opex-bot-integration.md <<'EOF'
          # v4.9.0 Gap Audit

          | Requirement | State |
          | --- | --- |
          | Exactly ten agents | REQUIRED/PASS GATE |
          | OpEx Bot is a shared Skill, not an agent | REQUIRED/PASS GATE |
          | COO-only entitlement | REQUIRED/PASS GATE |
          | No canonical mutation or external action | REQUIRED/PASS GATE |
          | Preserve CoS/CFO/AgentOps/COO/human authority | REQUIRED/PASS GATE |
          | Governed request/handoff contracts | REQUIRED/PASS GATE |
          | v4.8.4 retired as publisher | REQUIRED/PASS GATE |
          | v4.9.0 exact-SHA release | RELEASE GATE |
          EOF

          cat > tests/evaluations/test_opex_shared_capability_v490.py <<'EOF'
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]

          def test_opex_shared_capability_preserves_ten_agent_topology_and_authority() -> None:
              registry = json.loads((ROOT / 'agents/registry.json').read_text())
              agents = {item['agent_id']: item for item in registry['agents']}
              assert len(agents) == 10
              assert 'opex' not in agents and 'mesh-opex-bot' not in agents
              shared = [item for item in registry['shared_capabilities'] if item['capability'] == 'mesh-opex-bot']
              assert len(shared) == 1
              cap = shared[0]
              assert cap['type'] == 'shared_skill'
              assert cap['deployment'] == 'EXTERNAL_SHARED_SKILL'
              assert cap['consumers'] == ['coo']
              assert cap['authority'] == 'OPERATIONAL_EXCELLENCE_ADVISORY_ONLY'
              assert cap['canonical_facts_modified'] is False
              assert cap['external_action_included'] is False
              assert cap['request_contract'] == 'mesh.opex.request.v1'
              assert cap['response_contract'] == 'mesh.opex.handoff.v1'
              assert 'mesh-opex-bot' in agents['coo']['skills']
              for agent_id, record in agents.items():
                  assert ('mesh-opex-bot' in record.get('skills', [])) is (agent_id == 'coo')

          def test_coo_projection_and_fallback_are_governed() -> None:
              manifest = json.loads((ROOT / 'chatgpt/workspace-agents/coo.json').read_text())
              assert manifest['shared_skills'] == ['mesh-opex-bot']
              assert manifest['builder_configuration']['shared_skills'] == ['mesh-opex-bot']
              skill = (ROOT / 'chatgpt/skills/mesh-coo/SKILL.md').read_text()
              role = (ROOT / 'chatgpt/skills/mesh-coo/references/role-contract.md').read_text()
              for text in (skill, role):
                  assert 'mesh-opex-bot' in text
                  assert 'mesh.opex.request.v1' in text
                  assert 'mesh.opex.handoff.v1' in text
                  assert 'canonical facts' in text.lower()
                  assert 'external action' in text.lower()
                  assert 'CoS' in text and 'CFO' in text and 'AgentOps' in text
              assert 'do not fabricate' in skill.lower()
          EOF

          cat > tests/evaluations/test_release_record_correction_v484.py <<'EOF'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          WORKFLOWS = ROOT / '.github' / 'workflows'

          def _active_yaml_text(path: Path) -> str:
              return '\n'.join(line for line in path.read_text(encoding='utf-8').splitlines() if not line.lstrip().startswith('#'))

          def test_v483_release_records_explicitly_include_v460_retirement() -> None:
              for path in (ROOT / 'CHANGELOG-v4.8.3.md', ROOT / 'docs/release-v4.8.3-historical-publisher-retirement.md', ROOT / 'docs/gap-audit-v4.8.3-historical-publisher-retirement.md'):
                  text = path.read_text(encoding='utf-8')
                  assert 'v4.6.0' in text, path
                  assert 'v4.8.2' in text, path

          def test_v484_is_historical_and_v490_is_the_only_current_publisher() -> None:
              historical = _active_yaml_text(WORKFLOWS / 'release-v4.8.4.yml')
              assert 'workflow_dispatch:' in historical
              assert 'branches: [main]' not in historical
              assert 'pull_request:' not in historical
              assert 'gh release create' not in historical
              assert 'contents: write' not in historical
              current = _active_yaml_text(WORKFLOWS / 'release-v4.9.0.yml')
              assert 'branches: [main]' in current
              assert 'pull_request:' in current
              assert 'gh release create v4.9.0' in current
              assert '--target "$GITHUB_SHA"' in current
              assert 'contents: write' in current

          def test_v490_release_identity_preserves_runtime_and_topology() -> None:
              readme = (ROOT / 'README.md').read_text(encoding='utf-8')
              release = (ROOT / 'RELEASE.md').read_text(encoding='utf-8')
              docs_index = (ROOT / 'docs/README.md').read_text(encoding='utf-8')
              for text in (readme, release, docs_index):
                  assert 'v4.9.0 Mesh OpEx Bot Shared Capability Integration' in text
                  assert '4.0.0' in text
                  assert '4.4.0' in text
              assert 'exactly 10' in readme.lower()
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('tests/evaluations/test_historical_release_workflows_v483.py')
          text = p.read_text()
          text = text.replace('"4.6.0", "4.7.0", "4.8.0", "4.8.1", "4.8.2", "4.8.3",', '"4.6.0", "4.7.0", "4.8.0", "4.8.1", "4.8.2", "4.8.3", "4.8.4",')
          start = text.index('def test_v484_is_the_only_semver_release_publisher()')
          text = text[:start] + '''def test_v490_is_the_only_semver_release_publisher() -> None:\n    current = _active_yaml_text((WORKFLOWS / "release-v4.9.0.yml").read_text(encoding="utf-8"))\n    assert "branches: [main]" in current\n    assert "pull_request:" in current\n    assert "gh release create v4.9.0" in current\n    assert "--target \\\"$GITHUB_SHA\\\"" in current\n    assert "permissions:\\n  contents: read" in current\n    assert "contents: write" in current\n'''
          p.write_text(text)
          PY

          cat > .github/workflows/release-v4.8.4.yml <<'EOF'
          name: v4.8.4 Historical Verification

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify-history:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: '3.12'
                - run: pip install -e '.[dev]'
                - run: pytest -q tests/evaluations/test_release_record_correction_v484.py tests/evaluations/test_historical_release_workflows_v483.py
          EOF

          cat > .github/workflows/release-v4.9.0.yml <<'EOF'
          name: v4.9.0 Mesh OpEx Bot Shared Capability Integration

          on:
            push:
              branches: [main]
              paths:
                - 'agents/registry.json'
                - 'chatgpt/skills/mesh-coo/**'
                - 'chatgpt/workspace-agents/coo.json'
                - 'scripts/check-chatgpt-packages.py'
                - 'tests/evaluations/test_opex_shared_capability_v490.py'
                - 'tests/evaluations/test_release_record_correction_v484.py'
                - 'tests/evaluations/test_historical_release_workflows_v483.py'
                - '.github/workflows/release-v4.8.4.yml'
                - '.github/workflows/release-v4.9.0.yml'
                - 'README.md'
                - 'RELEASE.md'
                - 'CHANGELOG-v4.9.0.md'
                - 'docs/README.md'
                - 'docs/release-v4.9.0-mesh-opex-bot-integration.md'
                - 'docs/security-review-v4.9.0-mesh-opex-bot-integration.md'
                - 'docs/verification-v4.9.0-mesh-opex-bot-integration.md'
                - 'docs/gap-audit-v4.9.0-mesh-opex-bot-integration.md'
            pull_request:
              paths:
                - 'agents/registry.json'
                - 'chatgpt/skills/mesh-coo/**'
                - 'chatgpt/workspace-agents/coo.json'
                - 'scripts/check-chatgpt-packages.py'
                - 'tests/evaluations/test_opex_shared_capability_v490.py'
                - 'tests/evaluations/test_release_record_correction_v484.py'
                - 'tests/evaluations/test_historical_release_workflows_v483.py'
                - '.github/workflows/release-v4.8.4.yml'
                - '.github/workflows/release-v4.9.0.yml'
                - 'README.md'
                - 'RELEASE.md'
                - 'CHANGELOG-v4.9.0.md'
                - 'docs/README.md'
                - 'docs/release-v4.9.0-mesh-opex-bot-integration.md'
                - 'docs/security-review-v4.9.0-mesh-opex-bot-integration.md'
                - 'docs/verification-v4.9.0-mesh-opex-bot-integration.md'
                - 'docs/gap-audit-v4.9.0-mesh-opex-bot-integration.md'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: v4.9.0-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: '3.12'
                - uses: actions/setup-node@v7
                  with:
                    node-version: '24'
                    cache: npm
                    cache-dependency-path: mcp/package-lock.json
                - run: pip install -e '.[dev]'
                - run: python -m pip check
                - run: npm ci
                  working-directory: mcp
                - run: npm run check
                  working-directory: mcp
                - run: python scripts/validate-contracts.py
                - run: python scripts/check-runtime-doc-drift.py
                - run: python scripts/check-chatgpt-packages.py
                - run: python scripts/check-owner-execution-readiness.py
                - run: python scripts/check-capability-closure.py
                - run: python scripts/check-published-action-surface.py
                - run: ruff check src
                - run: ruff check tests scripts --select E9,F63,F7,F82
                - run: mypy src --check-untyped-defs
                - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=100
                - run: bandit -q -r src -lll
                - run: python -m compileall -q src
                - run: pytest -q tests/evaluations/test_opex_shared_capability_v490.py tests/evaluations/test_release_record_correction_v484.py tests/evaluations/test_historical_release_workflows_v483.py

            release:
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              needs: verify
              runs-on: ubuntu-latest
              permissions:
                contents: write
              steps:
                - uses: actions/checkout@v7
                  with:
                    fetch-depth: 0
                - name: Publish exact-SHA v4.9.0 release
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    set -euo pipefail
                    if gh release view v4.9.0 >/dev/null 2>&1; then
                      existing_target="$(gh release view v4.9.0 --json targetCommitish --jq .targetCommitish)"
                      if [ "$existing_target" != "$GITHUB_SHA" ]; then
                        echo "v4.9.0 already exists at $existing_target, expected $GITHUB_SHA" >&2
                        exit 1
                      fi
                      exit 0
                    fi
                    gh release create v4.9.0 --target "$GITHUB_SHA" --title 'Mesh CoS v4.9.0 Mesh OpEx Bot Integration' --notes-file docs/release-v4.9.0-mesh-opex-bot-integration.md
          EOF
      - name: Verify migrated repository
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          python -m pip check
          npm ci --prefix mcp
          npm run check --prefix mcp
          python scripts/validate-contracts.py
          python scripts/check-runtime-doc-drift.py
          python scripts/check-chatgpt-packages.py
          python scripts/check-owner-execution-readiness.py
          python scripts/check-capability-closure.py
          python scripts/check-published-action-surface.py
          ruff check src
          ruff check tests scripts --select E9,F63,F7,F82
          mypy src --check-untyped-defs
          pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=100
          bandit -q -r src -lll
          python -m compileall -q src
          pytest -q tests/evaluations/test_opex_shared_capability_v490.py tests/evaluations/test_release_record_correction_v484.py tests/evaluations/test_historical_release_workflows_v483.py
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-v4.9.0-opex-integration.yml
          git config user.name 'Mesh Release Bot'
          git config user.email 'release-bot@meshdigital.io'
          git add -A
          git commit -m 'feat: integrate Mesh OpEx Bot shared capability v4.9.0'
          git push origin HEAD:feature/mesh-opex-bot-integration-v4.9.0
