name: v4.2.3 QNAP qnet egress readiness release candidate historical verification

# Historical publisher retired: gh release create v4.2.3
# Historical automatic trigger retired: branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.2.3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Preserve published v4.2.3 boundary
        run: |
          set -euo pipefail
          test -f docs/release-4.2.3-qnet-egress-readiness.md
          test -f deployment/qnap/tests/test-modern-mcp-transport.sh
          echo 'v4.2.3 is a published historical release; this workflow cannot publish or retarget it.'
