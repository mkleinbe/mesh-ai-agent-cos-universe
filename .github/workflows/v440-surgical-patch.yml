name: v4.4.0 one-shot surgical patch

on:
  push:
    branches:
      - fix/v4.4.0-authority-closure
    paths:
      - .github/workflows/v440-surgical-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v4.4.0-authority-closure
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact-match surgical patch
        run: python scripts/apply_v440_surgical_patch.py
      - name: Verify temporary patch assets self-removed
        run: |
          test ! -e scripts/apply_v440_surgical_patch.py
          test ! -e .github/workflows/v440-surgical-patch.yml
      - name: Commit and push patched tree
        run: |
          set -euo pipefail
          git config user.name 'Mesh Engineering Bot'
          git config user.email 'engineering-bot@meshdigital.io'
          git add -A
          git diff --cached --check
          git commit -m 'Harden owner execution migration and denial semantics'
          git push origin HEAD:fix/v4.4.0-authority-closure
