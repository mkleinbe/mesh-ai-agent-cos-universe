name: v4.11.0 Historical Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2e7ff513e5e1da1c9520a2d2abc7510f6a83a4c5
          fetch-depth: 0
      - name: Verify immutable v4.11.0 history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2e7ff513e5e1da1c9520a2d2abc7510f6a83a4c5"
          test "$(git rev-list -n 1 v4.11.0)" = "2e7ff513e5e1da1c9520a2d2abc7510f6a83a4c5"
          target="$(gh release view v4.11.0 --json targetCommitish --jq .targetCommitish)"
          test "$target" = "2e7ff513e5e1da1c9520a2d2abc7510f6a83a4c5"
          echo "v4.11.0 Commercial Growth OS Integration remains immutable"
