name: v4.9.1 Mesh Media OS Capability Registration

on:
  push:
    branches: [main]
    paths:
      - 'agents/registry.json'
      - 'tests/evaluations/test_enterprise_consulting_skill_consumption_v470.py'
      - 'tests/evaluations/test_media_os_capability_registration_v491.py'
      - 'tests/evaluations/test_historical_release_workflows_v483.py'
      - 'tests/evaluations/test_release_record_correction_v484.py'
      - '.github/workflows/release-v4.9.0.yml'
      - '.github/workflows/release-v4.9.1.yml'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG-v4.9.1.md'
      - 'docs/README.md'
      - 'docs/release-v4.9.1-media-os-capability-registration.md'
      - 'docs/security-review-v4.9.1-media-os-capability-registration.md'
      - 'docs/verification-v4.9.1-media-os-capability-registration.md'
      - 'docs/gap-audit-v4.9.1-media-os-capability-registration.md'
  pull_request:
    paths:
      - 'agents/registry.json'
      - 'tests/evaluations/test_enterprise_consulting_skill_consumption_v470.py'
      - 'tests/evaluations/test_media_os_capability_registration_v491.py'
      - 'tests/evaluations/test_historical_release_workflows_v483.py'
      - 'tests/evaluations/test_release_record_correction_v484.py'
      - '.github/workflows/release-v4.9.0.yml'
      - '.github/workflows/release-v4.9.1.yml'
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG-v4.9.1.md'
      - 'docs/README.md'
      - 'docs/release-v4.9.1-media-os-capability-registration.md'
      - 'docs/security-review-v4.9.1-media-os-capability-registration.md'
      - 'docs/verification-v4.9.1-media-os-capability-registration.md'
      - 'docs/gap-audit-v4.9.1-media-os-capability-registration.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4.9.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: python scripts/validate-contracts.py
      - run: python scripts/check-runtime-doc-drift.py
      - run: python scripts/check-chatgpt-packages.py
      - run: python scripts/check-owner-execution-readiness.py
      - run: python scripts/check-capability-closure.py
      - run: python scripts/check-published-action-surface.py
      - run: ruff check src
      - run: ruff check tests scripts --select E9,F63,F7,F82
      - run: mypy src --check-untyped-defs
      - run: pytest --cov=mesh_cos --cov-report=term-missing --cov-fail-under=100
      - run: bandit -q -r src -lll
      - run: python -m compileall -q src
      - run: pytest -q tests/evaluations/test_media_os_capability_registration_v491.py tests/evaluations/test_historical_release_workflows_v483.py tests/evaluations/test_release_record_correction_v484.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish exact-SHA v4.9.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.9.1 >/dev/null 2>&1; then
            existing_target="$(gh release view v4.9.1 --json targetCommitish --jq .targetCommitish)"
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "v4.9.1 already exists at $existing_target, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo 'v4.9.1 already exists at exact main SHA'
          else
            gh release create v4.9.1 --target "$GITHUB_SHA" --title 'Mesh CoS v4.9.1 Media OS Capability Registration' --notes-file docs/release-v4.9.1-media-os-capability-registration.md
          fi
      - name: Clean merged remediation branch
        run: git push origin --delete fix/media-os-v4.9.1-release || true
